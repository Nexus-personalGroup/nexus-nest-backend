# =============================================================================
# 開發環境的單一入口
# -----------------------------------------------------------------------------
# /api/*  → api:3000（NestJS，globalPrefix 為 /api）
# /*      → web:5173（Vite dev server）
#
# 目的不是「有一個 nginx」，是讓開發時的拓撲與正式的單一埠部署一致：
# 同一個 origin。兩種拓撲不一樣的話，CORS、cookie 的 SameSite、
# 以及 CSP 的分路徑判斷，在開發時走的都不是上線時那條路。
#
# **這是容器模式唯一的入口**——api 與 web 都沒有發布對外埠。所以本檔的路由表
# 就是「後端有哪些東西對外」的完整清單：漏掛一條路徑不會退化成慢一點或繞遠路，
# 而是那個功能從外面**完全不存在**。加後端路由前先確認它落在 /api 或 /socket.io 底下。
#
# 要直連 api / web 請改跑 host 模式（`pnpm docker:deps` + `pnpm dev`），那條路是
# 3000 / 5173。要分辨「代理壞了還是應用壞了」則從這個容器內部打後端：
#   docker compose exec nginx wget -qO- http://api:3000/api/health
#
# ⚠️ **抄去正式環境之前：有兩組路徑不該從外面進來。**
# 上面那句「先確認落在 /api 或 /socket.io 底下」管的是**別漏掛**，
# 這裡是反向的那一半——`location /api` 目前**一律轉發**，包含：
#
#   /api/metrics          JwtAuthGuard 明確豁免認證（APPLICATION_METRICS_ENABLED
#                         預設關閉，但開了就是無認證的指標端點）
#   /api/*/docs           Swagger UI
#   /api/*/docs-json      完整的後台 API 結構
#
# dev 綁 127.0.0.1 且 metrics 預設關閉，所以現在無害，**因此本檔刻意不封鎖它們**
# ——封鎖會擋掉日常開 Swagger。但這份設定的定位是正式單一埠拓撲的樣板，
# 而樣板會被抄：正式環境要在這裡加 `location = /api/metrics { deny all; }`
# 之類的排除，或把它們放到只有內網打得到的另一個 server 區塊。
#
# ⚠️ **本檔不得加任何安全標頭**（CSP / X-Frame-Options / X-Content-Type-Options
# / Referrer-Policy / HSTS…）。那些由後端的 helmet 統一負責，而 CSP 尤其不可加：
# 後端的 CSP 是**分路徑**的（`/api/admin/docs` 與 `/api/front/docs` 放寬讓
# Swagger UI 的 inline script 能跑，其餘套預設），豁免範圍由 `SWAGGER_SIDES`
# 單一來源決定。在這裡加一份會把整個判斷蓋掉，**而且兩邊都不會失敗**——
# 症狀是「Swagger UI 打不開」或「後台某個資源被擋」，沒有人會想到是 nginx。
#
# （參考來源 `docker-kgie-nest-backend` 的設定有 `add_header
# Content-Security-Policy`，那是因為**它的後端刻意停用了 CSP**。
# 照抄過來會直接推翻 fix-security-cleanup 做的事。）
# =============================================================================

# WebSocket 升級用的 Connection 值：**必須跟著請求走，不能寫死 "upgrade"**。
#
# 寫死的話，每一個普通 HTTP 請求都會帶著 `Connection: upgrade` 送到上游
# （$http_upgrade 為空時 nginx 會省略 Upgrade 標頭，但 Connection 是字面字串，
# 一定會送）。上游收到一個沒有 Upgrade 的 `Connection: upgrade`，
# 依 RFC 7230 是畸形的——Node 不會把它升級，但會把連線標成不可重用。
#
# **現在沒有症狀，而那正是要現在改的理由**：下面兩個 upstream 都沒有 keepalive，
# 本來就不重用上游連線。哪天有人為了效能加上 `keepalive 32;`，
# 它會**安靜地不生效**，而症狀是「加了 keepalive 但沒有變快」，沒有東西會失敗。
#
# 用 map 而不是在 location 裡寫 if：nginx 的 if 在 location 內有已知的求值陷阱
# （官方 wiki 的 "If Is Evil"），而 map 正是為這件事設計的。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api_upstream {
    server api:3000;
}

upstream web_upstream {
    server web:5173;
}

server {
    listen 80 default_server;
    server_name localhost;

    # SPA 的打包產物與上傳的附件都可能超過預設的 1M
    client_max_body_size 20M;

    # NestJS 的 globalPrefix 是 /api，所有路由（含 Swagger、health、metrics）都在其下
    location /api {
        proxy_pass http://api_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 與其他長連線用；WS 的 upgrade 標頭在這裡也留著，成本為零
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE（儀表板的即時推送）需要關閉緩衝，否則事件會被攢著不送
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # ⚠️ **Socket.IO 不在 /api 底下。** `setGlobalPrefix('api')` 只作用於 Nest 的
    # 路由，Socket.IO 是掛在 HTTP server 上的獨立 handler，路徑是 `/socket.io/`。
    # 少了這一段，聊天的 handshake 會被下面的 `location /` 送去 Vite——
    # **HTTP 全部正常，只有聊天連不上**，而 Vite 還會回 200 讓它看起來像成功。
    # （這個 bug 在本 change 的驗收階段真的發生過。）
    location /socket.io {
        proxy_pass http://api_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # WS 連線是長連線，預設 60 秒會被切斷後不斷重連
        proxy_read_timeout 3600s;
    }

    # 其餘全部給 Vite dev server
    location / {
        proxy_pass http://web_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite 的 HMR 走 WebSocket；缺這三行的結果是「改了檔案畫面不更新」，
        # 而 console 只會有一則不顯眼的連線失敗
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
    }
}
