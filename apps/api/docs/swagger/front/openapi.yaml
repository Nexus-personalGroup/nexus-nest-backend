openapi: 3.0.0

info:
  title: Nexus 前台 (Front) API
  version: 1.0.0
  description: |
    前台 API 文件。

    **除了 `/auth/*` 與 `/ping` 之外，所有端點都需要前台的 Bearer Token**
    （由 `POST /front/auth/login` 取得）。

    ⚠️ **後台（`/api/admin/*`）的 token 在這裡一律無效**——兩側各自使用不同的
    簽發 secret，簽章驗證就會失敗，不是權限不足。WebSocket 連線同理。

servers:
  - url: http://localhost:3000/api/front
    description: 本地開發環境（前台 API）

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        使用**前台**的 Access Token 進行身份驗證（`POST /front/auth/login` 取得）

        格式: Bearer {accessToken}

        後台（`/api/admin/*`）簽出的 token 在這裡一律無效：
        兩側各自使用不同的 secret，簽章驗證就會失敗。

  schemas:
    # ===== 通用回應格式 =====
    SuccessResponse:
      type: object
      description: 通用成功回應格式
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          description: 操作是否成功
          example: true
        data:
          type: object
          description: 回應資料
          nullable: true
        timestamp:
          type: string
          format: date-time
          description: 回應時間
          example: '2024-01-01T00:00:00.000Z'

    ErrorResponse:
      type: object
      description: 通用錯誤回應格式
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          description: 操作是否成功
          example: false
        message:
          type: string
          description: 錯誤訊息
          example: 發生錯誤
        code:
          type: string
          description: 錯誤代碼
          example: ERROR_CODE
        timestamp:
          type: string
          format: date-time
          description: 回應時間
          example: '2024-01-01T00:00:00.000Z'

  responses:
    # 400 Bad Request
    BadRequest:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 請求參數錯誤
            code: BAD_REQUEST
            timestamp: '2024-01-01T00:00:00.000Z'

    # 401 Unauthorized
    NoToken:
      description: 缺少授權憑證
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 缺少授權憑證，請先登入
            code: NO_TOKEN
            timestamp: '2024-01-01T00:00:00.000Z'

    TokenRevoked:
      description: Token 已登出或失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 已登出或失效
            code: TOKEN_REVOKED
            timestamp: '2024-01-01T00:00:00.000Z'

    TokenExpired:
      description: Token 已過期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 已過期
            code: TOKEN_EXPIRED
            timestamp: '2024-01-01T00:00:00.000Z'

    InvalidToken:
      description: Token 無效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 無效
            code: INVALID_TOKEN
            timestamp: '2024-01-01T00:00:00.000Z'

    # 403 Forbidden
    Forbidden:
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 權限不足
            code: FORBIDDEN
            timestamp: '2024-01-01T00:00:00.000Z'

    # 404 Not Found
    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 資源不存在
            code: NOT_FOUND
            timestamp: '2024-01-01T00:00:00.000Z'

    # 409 Conflict
    Conflict:
      description: 資源已存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 資源已存在
            code: CONFLICT
            timestamp: '2024-01-01T00:00:00.000Z'

    # 500 Internal Server Error
    InternalServerError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 伺服器發生未預期錯誤
            code: INTERNAL_SERVER_ERROR
            timestamp: '2024-01-01T00:00:00.000Z'

# 順序即宣告順序。新增 tag 要補進這裡，否則它會掉到最後面且沒有說明
tags:
  - name: FrontAuth
    description: >-
      前台認證：登入、登出、換發 token、取得自己的資料。
      **與後台是兩套獨立的體系**，各自的簽發 secret 互不通用
  - name: ChatRoom
    description: 聊天室與室內的訊息：建立、列表、離開、歷史、已讀、撤回
  - name: ChatReport
    description: 檢舉他人的訊息。**沒有查詢端點**——被檢舉者不得知情
  - name: Ping
    description: 連通性檢查。唯一不需要 token 的端點

paths:
  /auth/login:
    post:
      $ref: './auth/login.yaml'

  /auth/refresh:
    post:
      $ref: './auth/refresh.yaml'

  /auth/logout:
    post:
      $ref: './auth/logout.yaml'

  /me:
    get:
      $ref: './auth/me.yaml'

  /chat-rooms:
    get:
      $ref: './chat-rooms/list.yaml'

  /chat-rooms/direct:
    post:
      $ref: './chat-rooms/create-direct.yaml'

  /chat-rooms/group:
    post:
      $ref: './chat-rooms/create-group.yaml'

  /chat-rooms/{roomId}/members/me:
    delete:
      $ref: './chat-rooms/leave.yaml'

  /chat-rooms/{roomId}/messages:
    get:
      $ref: './chat-rooms/messages.yaml'

  /chat-rooms/{roomId}/messages/{messageId}:
    delete:
      $ref: './chat-rooms/retract.yaml'

  /chat-rooms/{roomId}/read:
    patch:
      $ref: './chat-rooms/read.yaml'

  /chat-reports:
    post:
      $ref: './chat-reports/submit.yaml'

  /ping:
    get:
      $ref: './ping.yaml'
