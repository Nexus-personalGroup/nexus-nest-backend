tags: [FrontAuth]
summary: 前台忘記密碼
description: |
  產生密碼重設 token 並寄出重設信。無需認證。

  **無論信箱是否存在一律回 204**，判準與重發驗證信相同——
  這一支沒有「給使用者有用的回饋」這個需求可以拿來抵消帳號列舉的風險：
  使用者本來就只會看到「信寄出去了，請去收信」。

  **未驗證信箱的帳號也可以用**：忘記密碼與信箱驗證是兩件事，
  而重設信本身就會送到那個信箱——能收到就證明他擁有它。
  擋掉未驗證者只會讓「註冊完忘記密碼」變成一個死結。

  新的 token 會作廢先前未使用的重設 token。

  限流的額度**無論帳號存不存在都會扣**，理由同重發驗證信。

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [email]
        properties:
          email:
            type: string
            format: email
            maxLength: 255
      example:
        email: user@example.com

responses:
  '204':
    description: 已受理（無回應內容）。帳號不存在時同樣回 204
  '400':
    description: 欄位不符 schema
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
        example:
          success: false
          message: 資料驗證失敗
          code: VALIDATION_ERROR
          timestamp: '2026-08-24T06:00:00.000Z'
  '429':
    description: 對該信箱的寄送過於頻繁
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
        example:
          success: false
          message: 寄送過於頻繁，請稍後再試
          code: EMAIL_SEND_RATE_LIMITED
          timestamp: '2026-08-24T06:00:00.000Z'
  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
