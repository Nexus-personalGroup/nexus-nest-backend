# 前台的 token 對與使用者摘要。**摘要刻意不含 tokenVersion 與 password**
type: object
required:
  [accessToken, refreshToken, accessTokenExpiresIn, refreshTokenExpiresIn, user]
properties:
  accessToken:
    type: string
  refreshToken:
    type: string
  accessTokenExpiresIn:
    type: integer
    description: 秒
  refreshTokenExpiresIn:
    type: integer
    description: 秒
  user:
    type: object
    required: [id, email, displayName, avatarUrl, emailVerified]
    properties:
      id:
        type: string
        format: uuid
      email:
        type: string
        format: email
      displayName:
        type: string
      avatarUrl:
        type: string
        nullable: true
      emailVerified:
        type: boolean
        description: |
          信箱是否已驗證。**false 時登得進來但聊不了天**——
          客戶端要據此決定是引導去聊天室還是引導去收驗證信。
          少了它，前台只能等第一次聊天請求被 403 才知道
