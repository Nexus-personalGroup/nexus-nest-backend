tags: [FrontAuth]
summary: 前台重設密碼
description: |
  以重設信裡的 token 設定新密碼。無需認證。

  成功會**遞增 `tokenVersion`，讓所有裝置立即登出**。那不是附加功能：
  會走到「忘記密碼」的情境本來就包含「帳號可能正被別人用著」，
  改完密碼卻讓對方的既有 session 繼續有效，等於只重設了一半。
  使用者需要用新密碼重新登入。

  **無效、過期、已使用、用途不符（例如拿驗證信的 token 來改密碼）
  一律回同一個錯誤**，四者不可區分——可區分的話就足以確認某個 token 曾經存在。

  密碼政策在消費 token 之前驗：反過來的話，密碼不合格時 token 已經沒了，
  使用者得回去重新申請一次。

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [token, password]
        properties:
          token:
            type: string
            maxLength: 255
          password:
            type: string
            maxLength: 128
            description: 複雜度由密碼政策判定
      example:
        token: 3f6c1b2a8d4e4a9fb1c72e5d9a0f7b31
        password: NewPass1234!

responses:
  '204':
    description: 已重設（無回應內容）。舊的 access token 同時失效
  '400':
    description: token 無效／過期／已使用／用途不符，或新密碼未通過政策
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
        example:
          success: false
          message: 連結無效或已過期，請重新申請
          code: INVALID_TOKEN
          timestamp: '2026-08-24T06:00:00.000Z'
  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
