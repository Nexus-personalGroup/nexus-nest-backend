openapi: 3.0.0
info:
  title: Hexagonal NestJS 前台 (Front) API
  version: 1.0.0
  description: |
    前台（公開）API 文件。目前僅骨架示範端點 /ping。
    實際前台端點以 `gen:module <name> --front` 產生後補進本文件。
servers:
  - url: 'http://localhost:3000/api/front'
    description: 本地開發環境（前台 API）
paths:
  /ping:
    get:
      tags:
        - Front
      summary: 前台健康探測（骨架示範）
      description: |
        公開端點，回傳前台 API 存活訊息，用於驗證 /api/front 路由與前台 swagger 骨架。
        無需認證。實際前台功能以 gen:module --front 產生。
      responses:
        '200':
          description: 前台 API 存活
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
                        example: 前台 API 運作中
                  timestamp:
                    type: string
                    format: date-time
              example:
                success: true
                data:
                  message: 前台 API 運作中
                timestamp: '2024-01-01T00:00:00.000Z'
