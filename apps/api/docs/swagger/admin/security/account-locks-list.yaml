tags: [Security]
summary: 查詢帳號鎖定列表
description: |
  分頁取得有鎖定紀錄（`lockedAt` 不為 null）的後台帳號；支援 email 模糊搜尋與狀態過濾。

  回應另帶 `lockEnabled`：帳號鎖定功能預設關閉，關閉時系統不會產生任何鎖定紀錄。

  **`status` 預設為 `locked`**：打開這一頁的人問的是「現在有誰被鎖著」。
  已到期但尚未被清除的紀錄（清除發生在下次登入或解鎖時）要指定
  `expired` 或 `all` 才查得到——系統沒有鎖定歷史表，那是唯一能回答
  「這個人今天被鎖過」的地方。

  到期判定與登入路徑共用同一份規則（`lockedAt` + `APPLICATION_ACCOUNT_LOCK_DURATION_MIN`）。

  需要 `SUPERADMIN` 角色（粗粒度 role gate，非細粒度 permission）。
  需要 JWT Bearer Token 認證。

security:
  - bearerAuth: []

parameters:
  - in: query
    name: page
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
    description: 頁碼
  - in: query
    name: limit
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 200
    description: 每頁筆數（未指定用 env DEFAULT_PAGE_LIMIT）
  - in: query
    name: search
    required: false
    schema:
      type: string
    description: email 模糊搜尋（contains，不分大小寫）；trim 後為空字串視為未提供
  - in: query
    name: status
    required: false
    schema:
      type: string
      enum: [locked, expired, all]
      default: locked
    description: 鎖定狀態過濾；非三者之一回 400

responses:
  '200':
    description: 查詢成功
    content:
      application/json:
        schema:
          type: object
          required: [success, data, timestamp]
          properties:
            success:
              type: boolean
              example: true
            data:
              type: object
              required: [list, meta, lockEnabled]
              properties:
                lockEnabled:
                  type: boolean
                  description: |
                    帳號鎖定功能是否啟用（`APPLICATION_ACCOUNT_LOCK_ENABLED`，預設 false）。
                    **關閉時登入路徑不會寫入 lockedAt，清單於是永遠是空的**——
                    呼叫端必須用這個旗標分辨「沒有人被鎖」與「根本不會鎖」。
                list:
                  type: array
                  description: 有鎖定紀錄的帳號清單，依鎖定時間遞減
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      member:
                        type: string
                        description: 帳號的顯示名稱
                      lockedAt:
                        type: string
                        format: date-time
                      unlocksAt:
                        type: string
                        format: date-time
                        description: 自動解鎖時間（lockedAt + 設定的時效）
                      failedLoginCount:
                        type: integer
                        example: 3
                      status:
                        type: string
                        enum: [locked, expired]
                        description: 判定後的狀態；expired 代表該帳號現在已經可以登入
                meta:
                  type: object
                  properties:
                    page:
                      type: integer
                      example: 1
                    limit:
                      type: integer
                      example: 10
                    total:
                      type: integer
                      example: 3
                    totalPages:
                      type: integer
                      example: 1
            timestamp:
              type: string
              format: date-time

  '400':
    $ref: '../openapi.yaml#/components/responses/BadRequest'

  '401':
    $ref: '../openapi.yaml#/components/responses/NoToken'

  '403':
    $ref: '../openapi.yaml#/components/responses/Forbidden'

  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
