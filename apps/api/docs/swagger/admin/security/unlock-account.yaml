tags: [Security]
summary: 解鎖帳號
description: |
  解除因登入失敗次數超過閾值而被鎖定的帳號。
  需要 `SUPERADMIN` 角色。需要 JWT Bearer Token 認證。

security:
  - bearerAuth: []

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [email]
        properties:
          email:
            type: string
            format: email
            description: 要解鎖的帳號 Email
            example: user@example.com

responses:
  '204':
    description: 解鎖成功（無 body）

  '400':
    $ref: '../openapi.yaml#/components/responses/BadRequest'

  '401':
    $ref: '../openapi.yaml#/components/responses/NoToken'

  '403':
    $ref: '../openapi.yaml#/components/responses/Forbidden'

  '404':
    description: 找不到該 email 對應的帳號
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
        example:
          success: false
          message: 找不到該 email 對應的帳號
          code: EMAIL_NOT_FOUND
          timestamp: '2024-01-01T00:00:00.000Z'

  '409':
    description: 帳號未處於鎖定狀態
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
        example:
          success: false
          message: 帳號未處於鎖定狀態，無需解鎖
          code: ACCOUNT_NOT_LOCKED
          timestamp: '2024-01-01T00:00:00.000Z'

  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
