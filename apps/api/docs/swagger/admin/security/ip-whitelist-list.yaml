tags: [Security]
summary: 查詢 IP 白名單
description: |
  分頁取得 IP 白名單記錄；支援 IP 模糊搜尋。
  需要 `SUPERADMIN` 角色（粗粒度 role gate，非細粒度 permission）。
  需要 JWT Bearer Token 認證。

security:
  - bearerAuth: []

parameters:
  - in: query
    name: page
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
    description: 頁碼
  - in: query
    name: limit
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 200
    description: 每頁筆數（未指定用 env DEFAULT_PAGE_LIMIT）
  - in: query
    name: search
    required: false
    schema:
      type: string
    description: IP 模糊搜尋（contains）；trim 後為空字串視為未提供

responses:
  '200':
    description: 查詢成功
    content:
      application/json:
        schema:
          type: object
          required: [success, data, timestamp]
          properties:
            success:
              type: boolean
              example: true
            data:
              type: object
              required: [list, meta]
              properties:
                list:
                  type: array
                  description: IP 白名單清單
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      ipAddress:
                        type: string
                      description:
                        type: string
                        nullable: true
                      createdBy:
                        type: string
                        format: uuid
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                meta:
                  type: object
                  properties:
                    page:
                      type: integer
                      example: 1
                    limit:
                      type: integer
                      example: 10
                    total:
                      type: integer
                      example: 42
                    totalPages:
                      type: integer
                      example: 5
            timestamp:
              type: string
              format: date-time

  '401':
    $ref: '../openapi.yaml#/components/responses/NoToken'

  '403':
    $ref: '../openapi.yaml#/components/responses/Forbidden'

  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
