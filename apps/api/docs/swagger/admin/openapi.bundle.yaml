        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                        example: 一般使用者
                      isAssignable:
                        type: boolean
                        description: 是否可被一般帳號指派；false 時前端 select 仍顯示但 disabled（由後端依角色屬性判斷）
                        example: true
                  timestamp:
                    type: string
                    format: date-time
