            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 找不到帳號
                code: MEMBER_NOT_FOUND
                timestamp: '2024-01-01T00:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Members
      summary: 更新帳號
      description: |
        更新帳號（PATCH 真 partial）：所有欄位皆選填，僅送出有變動的欄位即可，
        避免為了改一欄而回傳整列被併發寫入互相覆蓋。
        password 空白 / 未指定表示不改。
        需要 `BACKEND:ACCOUNT:EDIT` 權限。
        需要 JWT Bearer Token 認證。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: 帳號 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  description: Email
                member:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: 名稱
                password:
                  type: string
                  minLength: 8
                  maxLength: 30
                  description: 密碼（空白 / 未指定表示不改）
                roleId:
                  type: string
                  format: uuid
                  description: 所屬角色 ID
                status:
                  type: boolean
                  description: 啟用狀態
      responses:
        '204':
          description: 更新成功（無 body）
        '400':
          description: 參數錯誤、嘗試停用自己或預設帳號不可編輯
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                badRequest:
                  summary: 請求參數錯誤
                  value:
                    success: false
                    message: 請求參數錯誤
                    code: BAD_REQUEST
                    timestamp: '2024-01-01T00:00:00.000Z'
                cannotDisableSelf:
                  summary: 不可將自己停用
                  value:
                    success: false
                    message: 不可停用登入中的自己帳號
                    code: CANNOT_DISABLE_SELF
                    timestamp: '2024-01-01T00:00:00.000Z'
                defaultMemberNotEditable:
                  summary: 預設帳號不可編輯
                  value:
                    success: false
                    message: 預設帳號不可編輯
                    code: DEFAULT_MEMBER_NOT_EDITABLE
                    timestamp: '2024-01-01T00:00:00.000Z'
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 找不到帳號或 roleId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                memberNotFound:
                  summary: 帳號不存在
                  value:
                    success: false
                    message: 找不到帳號
                    code: MEMBER_NOT_FOUND
                    timestamp: '2024-01-01T00:00:00.000Z'
                roleNotFound:
                  summary: 角色不存在
                  value:
                    success: false
                    message: 角色不存在
                    code: ROLE_NOT_FOUND
                    timestamp: '2024-01-01T00:00:00.000Z'
        '409':
          description: Email 已被使用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Email 已被註冊
                code: EMAIL_ALREADY_EXISTS
                timestamp: '2024-01-01T00:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Members
      summary: 刪除帳號
      description: |
        帳號軟刪除（logical delete）。資料列保留，信箱改為 `原值_時間戳記` 以釋放唯一約束。
        需要 `BACKEND:ACCOUNT:EDIT` 權限。
