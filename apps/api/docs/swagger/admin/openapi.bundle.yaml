                  minLength: 1
                  maxLength: 100
                  example: 審核人員
                permissionCodes:
                  type: array
                  items:
                    type: string
                    pattern: '^[A-Z_]+:[A-Z_]+:(VIEW|EDIT)$'
                  default: []
                  example:
                    - 'BACKEND:ACCOUNT:VIEW'
