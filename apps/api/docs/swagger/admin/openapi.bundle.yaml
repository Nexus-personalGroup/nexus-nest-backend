                        type: array
                        items:
                          type: object
                          required:
                            - reportId
                            - counterpartId
                            - counterpartEmail
                            - roomId
                            - reason
                            - status
                            - createdAt
                          properties:
                            reportId:
                              type: string
                              format: uuid
                            counterpartId:
                              type: string
                              format: uuid
                              description: |
                                對造的成員 ID——查 `TARGET` 時是檢舉人，查 `REPORTER` 時是被檢舉人
                            counterpartEmail:
                              type: string
                              format: email
                              nullable: true
