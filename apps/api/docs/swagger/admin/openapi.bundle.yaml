          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required:
                      - list
                      - meta
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          required:
                            - id
                            - roomType
                            - name
                            - memberCount
                            - createdAt
                          properties:
                            id:
                              type: string
                              format: uuid
                            roomType:
                              type: string
                              enum:
