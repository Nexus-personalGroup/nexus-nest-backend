openapi: 3.0.0
info:
  title: Hexagonal NestJS 後台 (Admin) API
  version: 1.0.0
  description: |
    Hexagonal Architecture NestJS + Express API 文件
servers:
  - url: 'http://localhost:3000/api/admin'
    description: 本地開發環境（後台 API）
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        使用 Access Token 進行身份驗證

        格式: Bearer {accessToken}
  schemas:
    SuccessResponse:
      type: object
      description: 通用成功回應格式
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          description: 操作是否成功
          example: true
        data:
          type: object
          description: 回應資料
          nullable: true
        timestamp:
          type: string
          format: date-time
          description: 回應時間
          example: '2024-01-01T00:00:00.000Z'
    ErrorResponse:
      type: object
      description: 通用錯誤回應格式
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          description: 操作是否成功
          example: false
        message:
          type: string
          description: 錯誤訊息
          example: 發生錯誤
        code:
          type: string
          description: 錯誤代碼
          example: ERROR_CODE
        timestamp:
          type: string
          format: date-time
          description: 回應時間
          example: '2024-01-01T00:00:00.000Z'
  responses:
    BadRequest:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 請求參數錯誤
            code: BAD_REQUEST
            timestamp: '2024-01-01T00:00:00.000Z'
    NoToken:
      description: 缺少授權憑證
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 缺少授權憑證，請先登入
            code: NO_TOKEN
            timestamp: '2024-01-01T00:00:00.000Z'
    TokenRevoked:
      description: Token 已登出或失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 已登出或失效
            code: TOKEN_REVOKED
            timestamp: '2024-01-01T00:00:00.000Z'
    TokenExpired:
      description: Token 已過期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 已過期
            code: TOKEN_EXPIRED
            timestamp: '2024-01-01T00:00:00.000Z'
    InvalidToken:
      description: Token 無效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 無效
            code: INVALID_TOKEN
            timestamp: '2024-01-01T00:00:00.000Z'
    Forbidden:
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 權限不足
            code: FORBIDDEN
            timestamp: '2024-01-01T00:00:00.000Z'
    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 資源不存在
            code: NOT_FOUND
            timestamp: '2024-01-01T00:00:00.000Z'
    Conflict:
      description: 資源已存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 資源已存在
            code: CONFLICT
            timestamp: '2024-01-01T00:00:00.000Z'
    InternalServerError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 伺服器發生未預期錯誤
            code: INTERNAL_SERVER_ERROR
            timestamp: '2024-01-01T00:00:00.000Z'
paths:
  /moderation/reports:
    get:
      tags:
        - Moderation
      summary: 查詢檢舉佇列
      description: |
        需 `BACKEND:MODERATION:VIEW` 權限。預設只回傳 `PENDING`——
        佇列的用途是「還有什麼要處理」，不是瀏覽歷史。

        **回應不含 `contentSnapshot`**。列表不含內容有兩個作用：讓稽核量與
        「實際看到敏感內容的次數」對齊（詳情端點才會寫稽核），
        也讓管理員瀏覽時不會無意間看到一整頁敏感內容。

        **本端點不會寫入稽核紀錄。**
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - REVIEWED
              - DISMISSED
            default: PENDING
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required:
                      - list
                      - meta
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          required:
                            - reportId
                            - reporterId
                            - reporterEmail
                            - targetMemberId
                            - targetMemberEmail
                            - roomId
                            - reason
                            - status
                            - createdAt
                          properties:
                            reportId:
                              type: string
                              format: uuid
                            reporterId:
                              type: string
                              format: uuid
                            reporterEmail:
                              type: string
                              format: email
                              nullable: true
                              description: 檢舉人的 email；該帳號已被刪除時為 null
                            targetMemberId:
                              type: string
                              format: uuid
                            targetMemberEmail:
                              type: string
                              format: email
                              nullable: true
                              description: 被檢舉人的 email；該帳號已被刪除時為 null
                            roomId:
                              type: string
                              format: uuid
                            reason:
                              type: string
                              enum:
                                - HARASSMENT
                                - SPAM
                                - INAPPROPRIATE
                                - OTHER
                            status:
                              type: string
                              enum:
                                - PENDING
                                - REVIEWED
                                - DISMISSED
                            createdAt:
                              type: string
                              format: date-time
                      meta:
                        type: object
                        required:
                          - page
                          - limit
                          - total
                          - totalPages
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          totalPages:
                            type: integer
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/moderation/reports/{reportId}':
    get:
      tags:
        - Moderation
      summary: 查詢檢舉詳情
      description: |
        需 `BACKEND:MODERATION:VIEW` 權限。

        **這是唯一能看到被撤回訊息內容的路徑**（透過檢舉當下的內容快照），
        因此**每次呼叫都會寫入一筆 `REPORT_VIEWED` 稽核**。

        查看不留痕跡的話，這條路徑與「任何人都看得到」在事後沒有實質區別——
        差別只在誰有權限，而權限可能被誤配、被濫用、或在事後被質疑。

        稽核寫入失敗不會讓查詢失敗（best-effort），但會以 error 等級記錄。
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required:
                      - reportId
                      - reporterId
                      - reporterEmail
                      - targetMemberId
                      - targetMemberEmail
                      - targetMessageId
                      - targetMessageRemovedAt
                      - roomId
                      - reason
                      - status
                      - contentSnapshot
                      - createdAt
                    properties:
                      reportId:
                        type: string
                        format: uuid
                      reporterId:
                        type: string
                        format: uuid
                      reporterEmail:
                        type: string
                        format: email
                        nullable: true
                        description: 檢舉人的 email；該帳號已被刪除時為 null
                      targetMemberId:
                        type: string
                        format: uuid
                      targetMemberEmail:
                        type: string
                        format: email
                        nullable: true
                        description: 被檢舉人的 email；該帳號已被刪除時為 null
                      targetMessageId:
                        type: string
                        format: uuid
                      targetMessageRemovedAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: |
                          被檢舉訊息目前的移除時間；**未被移除或該訊息已不存在時為 null**。

                          回時間戳而非布林：布林會讓「何時被移除」永遠拿不到，
                          而那是審閱紀錄的一部分。介面依本欄二選一顯示「移除」或「還原」。
                      roomId:
                        type: string
                        format: uuid
                      reason:
                        type: string
                        enum:
                          - HARASSMENT
                          - SPAM
                          - INAPPROPRIATE
                          - OTHER
                      status:
                        type: string
                        enum:
                          - PENDING
                          - REVIEWED
                          - DISMISSED
                      description:
                        type: string
                        nullable: true
                      contentSnapshot:
                        type: string
                        description: 檢舉當下的訊息內容；即使該訊息已被撤回也會回傳
                      reviewedAt:
                        type: string
                        format: date-time
                        nullable: true
                      reviewedBy:
                        type: string
                        format: uuid
                        nullable: true
                      reviewNote:
                        type: string
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 檢舉不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 檢舉不存在
                code: CHAT_REPORT_NOT_FOUND
                timestamp: '2026-08-21T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Moderation
      summary: 判定檢舉
      description: |
        需 `BACKEND:MODERATION:EDIT` 權限（與 VIEW 分開：查看接觸敏感內容、
        判定改變狀態，「能看的人」與「能判的人」經常不是同一群）。

        **只做狀態流轉**，不移除訊息也不停用帳號——那些是獨立的行為，
        各自需要自己的授權、稽核，以及對使用者的語意
        （「因違規被移除」與「已收回」對客戶端是不同的東西）。

        `REVIEWED` 與 `DISMISSED` 之間可以互轉（終態間的更正）；
        **不可改回 `PENDING`**，那是「重新開啟」，語意不同。
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - REVIEWED
                    - DISMISSED
                reviewNote:
                  type: string
                  maxLength: 500
            example:
              status: REVIEWED
              reviewNote: 已私下警告
      responses:
        '204':
          description: 已判定（無回應內容）
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 檢舉不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 檢舉不存在
                code: CHAT_REPORT_NOT_FOUND
                timestamp: '2026-08-21T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/moderation/messages/{messageId}':
    delete:
      tags:
        - Moderation
      summary: 移除違規訊息
      description: |
        需 `BACKEND:MODERATION:EDIT` 權限。

        **不要求該訊息被檢舉過**：管理員可能從私訊、主動巡邏等管道發現違規內容。
        移除的授權來自 RBAC，不來自檢舉的存在。

        移除採**軟刪除**：該則與它的 `seq` 會保留、內容保留在資料庫（供調查與申訴），
        但前台看不到內容。它在歷史與斷線補齊中仍會出現，帶 `removedAt`。

        **與使用者撤回是不同的標記**（`removedAt` vs `retractedAt`）：
        兩者對客戶端的語意不同（「因違反規範被移除」vs「對方自己收回」）。
        兩個標記可以同時存在，呈現上以移除優先。

        **冪等**：重複移除回 `204`，不重複推播、不覆寫原本的移除時間。

        成功時房間成員會收到 `server:messageRemoved`（payload 不含內容）。
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 已移除（無回應內容）；重複移除同樣回 204
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 訊息不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 訊息不存在或不是你發送的
                code: CHAT_MESSAGE_NOT_FOUND
                timestamp: '2026-08-21T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/moderation/messages/{messageId}/restore':
    post:
      tags:
        - Moderation
      summary: 還原被誤移除的訊息
      description: |
        需 `BACKEND:MODERATION:EDIT` 權限。

        誤判在審閱情境是真實的——沒有回頭路會讓管理員傾向不敢處理，
        而一個不敢用的工具等於沒有工具。

        **不影響使用者自己的撤回狀態**：若該則原本已被發送者撤回，
        還原後它會回到「已收回」而非完全正常。推播的 payload 會帶還原後的 `retractedAt`，
        讓客戶端知道要顯示哪一種。

        **還原同樣留稽核**：`removedAt` 清除後，「這則曾被移除過」就不再留在訊息列上，
        而反覆移除再還原本身就是可疑行為。

        **冪等**：還原未被移除的訊息回 `204`，不推播。
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 已還原（無回應內容）；未被移除時同樣回 204
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 訊息不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 訊息不存在或不是你發送的
                code: CHAT_MESSAGE_NOT_FOUND
                timestamp: '2026-08-21T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/moderation/members/{memberId}/suspend':
    post:
      tags:
        - Moderation
      summary: 停權成員
      description: |
        需 `BACKEND:MODERATION:EDIT` 權限。

        與帳號管理的 `PATCH /api/admin/members/{id} { "status": false }` **效果完全相同**
        ——兩者呼叫同一個 use case。刻意並存是因為角色不同：
        「能管帳號的人」與「能做審閱處置的人」在真實團隊裡經常不是同一群
        （客服能停權違規者，但不該改帳號的角色與密碼）。

        停權會做三件事：帳號停用、context 快取清除、**既有的 WebSocket 連線被斷開**。

        第三項是關鍵：連線層的認證只在 handshake 執行一次，之後的事件只驗資源層級的授權。
        不主動撤銷的話，**被停權的人只要連線還開著就能繼續送訊息**。
        被斷線的客戶端會先收到 `server:sessionRevoked`，據此停止自動重連。

        **冪等**：對已停用的帳號再次停權回 `204`，不重複斷線也不重複稽核。
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 已停權（無回應內容）；已停用時同樣回 204
        '400':
          description: 嘗試停權自己
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 無法停用自己的帳號
                code: SELF_DISABLE_FORBIDDEN
                timestamp: '2026-08-21T06:00:00.000Z'
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 成員不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 找不到帳號
                code: MEMBER_NOT_FOUND
                timestamp: '2026-08-21T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/moderation/members/{memberId}/reinstate':
    post:
      tags:
        - Moderation
      summary: 解除停權
      description: |
        需 `BACKEND:MODERATION:EDIT` 權限。恢復該成員的帳號，使用者重新登入即可。

        **不會主動通知或恢復連線**：他的連線已經斷了、token 也失效了，
        沒有任何管道可以推給他。要通知得走 email 或推播通知，那是另一個主題。

        **解除同樣留稽核**：`members.status` 只留下「現在是什麼狀態」，
        留不下「誰在什麼時候改的」，而反覆停權再解除本身就是可疑行為。

        **冪等**：對未停用的帳號解除回 `204`，不重複稽核。
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 已解除（無回應內容）；本來就啟用時同樣回 204
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 成員不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 找不到帳號
                code: MEMBER_NOT_FOUND
                timestamp: '2026-08-21T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /moderation/rooms:
    get:
      tags:
        - Moderation
      summary: 查詢聊天室列表
      description: |
        需 `BACKEND:MODERATION:VIEW` 權限。

        **回應不含任何訊息內容**——總覽回答的是「這個房間發生了什麼」，
        不是「他們說了什麼」。要看內容仍然只能經由檢舉，那保持了「看內容必須有理由」。
      parameters:
        - name: roomType
          in: query
          required: false
          schema:
            type: string
            enum:
              - DIRECT
              - GROUP
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required:
                      - list
                      - meta
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          required:
                            - roomId
                            - roomType
                            - name
                            - memberCount
                            - messageCount
                            - createdAt
                          properties:
                            roomId:
                              type: string
                              format: uuid
                            roomType:
                              type: string
                              enum:
                                - DIRECT
                                - GROUP
                            name:
                              type: string
                              nullable: true
                              description: 群組名稱；私聊為 null（顯示名稱由對方決定，不落庫）
                            memberCount:
                              type: integer
                            messageCount:
                              type: integer
                              description: |
                                **歷史訊息總數**，取自 `chat_rooms.last_seq`。

                                語意是「這個房間曾經有多少則」——**含已撤回與已被管理員移除的訊息**，
                                不是「目前存在幾則」。訊息列永遠不會被刪除（刪了會讓 seq 出現洞，
                                補齊的客戶端無法區分「被清掉」與「我漏收了」），因此兩者目前相等，
                                但 last_seq 不需要多一次查詢。
                            createdAt:
                              type: string
                              format: date-time
                      meta:
                        type: object
                        required:
                          - page
                          - limit
                          - total
                          - totalPages
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          totalPages:
                            type: integer
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: roomType 不是 DIRECT 或 GROUP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 資料驗證失敗
                code: VALIDATION_ERROR
                timestamp: '2026-08-21T06:00:00.000Z'
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/moderation/rooms/{roomId}':
    get:
      tags:
        - Moderation
      summary: 查詢單一聊天室的概覽
      description: |
        需 `BACKEND:MODERATION:VIEW` 權限。

        回傳房間概覽與**完整成員清單**（不分頁：房間成員數受業務常識約束，
        而分頁一個 20 人的清單只會多一組狀態要管）。

        **回應不含訊息內容，也不含任何訊息 ID**——房間詳情不是內容存取路徑。
        要看內容只能經由檢舉。
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required:
                      - roomId
                      - roomType
                      - name
                      - memberCount
                      - messageCount
                      - createdAt
                      - members
                    properties:
                      roomId:
                        type: string
                        format: uuid
                      roomType:
                        type: string
                        enum:
                          - DIRECT
                          - GROUP
                      name:
                        type: string
                        nullable: true
                        description: 群組名稱；私聊為 null
                      memberCount:
                        type: integer
                      messageCount:
                        type: integer
                        description: |
                          **歷史訊息總數**，含已撤回與已被移除的訊息；不是「目前存在幾則」
                      createdAt:
                        type: string
                        format: date-time
                      members:
                        type: array
                        items:
                          type: object
                          required:
                            - memberId
                            - email
                            - joinedAt
                          properties:
                            memberId:
                              type: string
                              format: uuid
                            email:
                              type: string
                              format: email
                              nullable: true
                              description: 該帳號已被刪除時為 null
                            joinedAt:
                              type: string
                              format: date-time
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 聊天室不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 聊天室不存在
                code: CHAT_ROOM_NOT_FOUND
                timestamp: '2026-08-21T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/moderation/members/{memberId}':
    get:
      tags:
        - Moderation
      summary: 查詢成員的審閱概覽
      description: |
        需 `BACKEND:MODERATION:VIEW` 權限。

        **只回審閱需要的欄位**——不含角色、權限、最後登入 IP 或任何密碼相關欄位。
        那些回答的是「他能做什麼」，屬於 `BACKEND:ACCOUNT:VIEW` 圈起來的範圍。

        **授權範圍是明示的**：具備 `BACKEND:MODERATION:VIEW` 者可查詢任何成員，
        不要求該成員與檢舉相關。要求「必須先有檢舉」會讓「查一個剛被停權的人」
        這種正當操作失敗，而它擋不住真正想濫用的人。

        本端點**不寫稽核**：回應不含任何訊息內容。
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required:
                      - memberId
                      - email
                      - status
                      - joinedAt
                      - isOnline
                      - reportedCount
                      - submittedReportCount
                      - roomCount
                    properties:
                      memberId:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      status:
                        type: boolean
                        description: 帳號啟用狀態；false 代表已停權
                      joinedAt:
                        type: string
                        format: date-time
                      isOnline:
                        type: boolean
                        description: |
                          **查詢當下**的在線狀態，不保證即時。
                          畫面應標明這一點，否則使用者會以為它會自動更新。
                      reportedCount:
                        type: integer
                        description: 被檢舉的次數
                      submittedReportCount:
                        type: integer
                        description: 提出檢舉的次數
                      roomCount:
                        type: integer
                        description: 所在聊天室數量
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 成員不存在或已被刪除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 找不到帳號
                code: MEMBER_NOT_FOUND
                timestamp: '2026-08-21T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/moderation/members/{memberId}/reports':
    get:
      tags:
        - Moderation
      summary: 查詢與成員相關的檢舉
      description: |
        需 `BACKEND:MODERATION:VIEW` 權限。

        `role` 決定方向：`TARGET`（該成員被檢舉，預設）或 `REPORTER`（該成員提出的）。
        **兩個方向分開查詢**——「他被檢舉 10 次」與「他檢舉別人 10 次」在同一個
        「檢舉相關 10 筆」底下看起來一樣，而那是兩件意義相反的事。

        回應**不含 `contentSnapshot`**，理由與檢舉佇列相同：本端點不寫稽核，
        因此它不能看得到內容。
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum:
              - TARGET
              - REPORTER
            default: TARGET
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required:
                      - list
                      - meta
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          required:
                            - reportId
                            - counterpartId
                            - counterpartEmail
                            - roomId
                            - reason
                            - status
                            - createdAt
                          properties:
                            reportId:
                              type: string
                              format: uuid
                            counterpartId:
                              type: string
                              format: uuid
                              description: |
                                對造的成員 ID——查 `TARGET` 時是檢舉人，查 `REPORTER` 時是被檢舉人
                            counterpartEmail:
                              type: string
                              format: email
                              nullable: true
                              description: 對造的 email；該帳號已被刪除時為 null
                            roomId:
                              type: string
                              format: uuid
                            reason:
                              type: string
                              enum:
                                - HARASSMENT
                                - SPAM
                                - INAPPROPRIATE
                                - OTHER
                            status:
                              type: string
                              enum:
                                - PENDING
                                - REVIEWED
                                - DISMISSED
                            createdAt:
                              type: string
                              format: date-time
                      meta:
                        type: object
                        required:
                          - page
                          - limit
                          - total
                          - totalPages
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          totalPages:
                            type: integer
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: role 不是 TARGET 或 REPORTER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 資料驗證失敗
                code: VALIDATION_ERROR
                timestamp: '2026-08-21T06:00:00.000Z'
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/moderation/members/{memberId}/rooms':
    get:
      tags:
        - Moderation
      summary: 查詢成員所在的聊天室
      description: |
        需 `BACKEND:MODERATION:VIEW` 權限。

        **與前台的「我的房間」是同一支查詢**，差別只在授權來源：
        前台是「你只能查自己的」（memberId 來自 token），
        這裡是「有權限就能查任何人的」（memberId 來自 path）。

        `name` 為 null 代表私聊——顯示名稱由對方決定，不落庫。
        `createdAt` 是**房間的建立時間**，不是該成員的加入時間。
      parameters:
        - name: memberId
