openapi: 3.0.0
info:
  title: Nexus 後台 (Admin) API
  version: 1.0.0
  description: |
    後台管理 API 文件。

    **所有端點都需要後台的 Bearer Token**（由 `POST /admin/auth/login` 取得），
    並依端點各自宣告的權限碼授權（`BACKEND:*`）。

    ⚠️ **前台（`/api/front/*`）的 token 在這裡一律無效**——兩側各自使用不同的
    簽發 secret，簽章驗證就會失敗，不是權限不足。

    本文件涵蓋的「會員」有**兩種、分屬兩張互不相交的表**，別看混了：
    `Members` 是後台管理員（`members`），`FrontUsers` 是聊天服務的使用者（`users`）。
servers:
  - url: 'http://localhost:3000/api/admin'
    description: 本地開發環境（後台 API）
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        使用 Access Token 進行身份驗證

        格式: Bearer {accessToken}
  schemas:
    SuccessResponse:
      type: object
      description: 通用成功回應格式
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          description: 操作是否成功
          example: true
        data:
          type: object
          description: 回應資料
          nullable: true
        timestamp:
          type: string
          format: date-time
          description: 回應時間
          example: '2024-01-01T00:00:00.000Z'
    ErrorResponse:
      type: object
      description: 通用錯誤回應格式
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          description: 操作是否成功
          example: false
        message:
          type: string
          description: 錯誤訊息
          example: 發生錯誤
        code:
          type: string
          description: 錯誤代碼
          example: ERROR_CODE
        timestamp:
          type: string
          format: date-time
          description: 回應時間
          example: '2024-01-01T00:00:00.000Z'
  responses:
    BadRequest:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 請求參數錯誤
            code: BAD_REQUEST
            timestamp: '2024-01-01T00:00:00.000Z'
    NoToken:
      description: 缺少授權憑證
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 缺少授權憑證，請先登入
            code: NO_TOKEN
            timestamp: '2024-01-01T00:00:00.000Z'
    TokenRevoked:
      description: Token 已登出或失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 已登出或失效
            code: TOKEN_REVOKED
            timestamp: '2024-01-01T00:00:00.000Z'
    TokenExpired:
      description: Token 已過期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 已過期
            code: TOKEN_EXPIRED
            timestamp: '2024-01-01T00:00:00.000Z'
    InvalidToken:
      description: Token 無效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 無效
            code: INVALID_TOKEN
            timestamp: '2024-01-01T00:00:00.000Z'
    Forbidden:
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 權限不足
            code: FORBIDDEN
            timestamp: '2024-01-01T00:00:00.000Z'
    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 資源不存在
            code: NOT_FOUND
            timestamp: '2024-01-01T00:00:00.000Z'
    Conflict:
      description: 資源已存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 資源已存在
            code: CONFLICT
            timestamp: '2024-01-01T00:00:00.000Z'
    InternalServerError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 伺服器發生未預期錯誤
            code: INTERNAL_SERVER_ERROR
            timestamp: '2024-01-01T00:00:00.000Z'
tags:
  - name: Auth
    description: 後台認證：登入、登出、換發 token、忘記與重設密碼
  - name: Profile
    description: 目前登入者自己的資料
  - name: Members
    description: 後台帳號管理（`members`）——**同事的帳號**，不是聊天的使用者
  - name: Roles
    description: 角色與權限碼的指派
  - name: FrontUsers
    description: '前台會員管理（`users`）——**聊天服務的使用者**。與 Members 是兩個不相交的 帳號體系，權限碼也分開（`BACKEND:FRONT_USER:*`）'
  - name: Moderation
    description: 檢舉審閱：佇列、詳情、判定、訊息移除／還原、成員行為時間軸、 聊天室總覽，以及審閱側的停權入口
  - name: Dashboard
    description: 營運總覽的即時數字（快照與 SSE 串流）
  - name: Attachments
    description: 附件上傳與刪除
  - name: Security
    description: IP 白名單／黑名單與帳號解鎖（SUPERADMIN）
paths:
  /moderation/reports:
    get:
      tags:
        - Moderation
      summary: 查詢檢舉佇列
      description: |
        需 `BACKEND:MODERATION:VIEW` 權限。預設只回傳 `PENDING`——
        佇列的用途是「還有什麼要處理」，不是瀏覽歷史。

        **回應不含 `contentSnapshot`**。列表不含內容有兩個作用：讓稽核量與
        「實際看到敏感內容的次數」對齊（詳情端點才會寫稽核），
        也讓管理員瀏覽時不會無意間看到一整頁敏感內容。

        **本端點不會寫入稽核紀錄。**
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - REVIEWED
              - DISMISSED
            default: PENDING
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required:
                      - list
                      - meta
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          required:
                            - reportId
                            - reporterId
                            - reporterEmail
                            - targetMemberId
                            - targetMemberEmail
                            - roomId
                            - reason
                            - status
                            - createdAt
                          properties:
                            reportId:
                              type: string
                              format: uuid
                            reporterId:
                              type: string
                              format: uuid
                            reporterEmail:
                              type: string
                              format: email
                              nullable: true
                              description: 檢舉人的 email；該帳號已被刪除時為 null
                            targetMemberId:
                              type: string
                              format: uuid
                            targetMemberEmail:
                              type: string
                              format: email
                              nullable: true
                              description: 被檢舉人的 email；該帳號已被刪除時為 null
                            roomId:
                              type: string
                              format: uuid
                            reason:
                              type: string
                              enum:
                                - HARASSMENT
                                - SPAM
                                - INAPPROPRIATE
                                - OTHER
                            status:
                              type: string
                              enum:
                                - PENDING
                                - REVIEWED
                                - DISMISSED
                            createdAt:
                              type: string
                              format: date-time
                      meta:
                        type: object
                        required:
                          - page
                          - limit
                          - total
                          - totalPages
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          totalPages:
                            type: integer
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/moderation/reports/{reportId}':
    get:
      tags:
        - Moderation
      summary: 查詢檢舉詳情
      description: |
        需 `BACKEND:MODERATION:VIEW` 權限。

        **這是唯一能看到被撤回訊息內容的路徑**（透過檢舉當下的內容快照），
        因此**每次呼叫都會寫入一筆 `REPORT_VIEWED` 稽核**。

        查看不留痕跡的話，這條路徑與「任何人都看得到」在事後沒有實質區別——
        差別只在誰有權限，而權限可能被誤配、被濫用、或在事後被質疑。

        稽核寫入失敗不會讓查詢失敗（best-effort），但會以 error 等級記錄。
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required:
                      - reportId
                      - reporterId
                      - reporterEmail
                      - targetMemberId
                      - targetMemberEmail
                      - targetMessageId
                      - targetMessageRemovedAt
                      - roomId
                      - reason
                      - status
                      - contentSnapshot
                      - createdAt
                    properties:
                      reportId:
                        type: string
                        format: uuid
                      reporterId:
                        type: string
                        format: uuid
                      reporterEmail:
                        type: string
                        format: email
                        nullable: true
                        description: 檢舉人的 email；該帳號已被刪除時為 null
                      targetMemberId:
                        type: string
                        format: uuid
                      targetMemberEmail:
                        type: string
                        format: email
                        nullable: true
                        description: 被檢舉人的 email；該帳號已被刪除時為 null
                      targetMessageId:
                        type: string
                        format: uuid
                      targetMessageRemovedAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: |
                          被檢舉訊息目前的移除時間；**未被移除或該訊息已不存在時為 null**。

                          回時間戳而非布林：布林會讓「何時被移除」永遠拿不到，
                          而那是審閱紀錄的一部分。介面依本欄二選一顯示「移除」或「還原」。
                      roomId:
                        type: string
                        format: uuid
                      reason:
                        type: string
                        enum:
                          - HARASSMENT
                          - SPAM
                          - INAPPROPRIATE
                          - OTHER
                      status:
                        type: string
                        enum:
                          - PENDING
                          - REVIEWED
                          - DISMISSED
                      description:
                        type: string
                        nullable: true
                      contentSnapshot:
                        type: string
                        description: 檢舉當下的訊息內容；即使該訊息已被撤回也會回傳
                      reviewedAt:
                        type: string
                        format: date-time
                        nullable: true
                      reviewedBy:
                        type: string
                        format: uuid
                        nullable: true
                      reviewNote:
                        type: string
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 檢舉不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 檢舉不存在
                code: CHAT_REPORT_NOT_FOUND
                timestamp: '2026-08-21T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Moderation
      summary: 判定檢舉
      description: |
        需 `BACKEND:MODERATION:EDIT` 權限（與 VIEW 分開：查看接觸敏感內容、
        判定改變狀態，「能看的人」與「能判的人」經常不是同一群）。

        **只做狀態流轉**，不移除訊息也不停用帳號——那些是獨立的行為，
        各自需要自己的授權、稽核，以及對使用者的語意
        （「因違規被移除」與「已收回」對客戶端是不同的東西）。

        `REVIEWED` 與 `DISMISSED` 之間可以互轉（終態間的更正）；
        **不可改回 `PENDING`**，那是「重新開啟」，語意不同。
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - REVIEWED
                    - DISMISSED
                reviewNote:
                  type: string
                  maxLength: 500
            example:
              status: REVIEWED
              reviewNote: 已私下警告
      responses:
        '204':
          description: 已判定（無回應內容）
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 檢舉不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 檢舉不存在
                code: CHAT_REPORT_NOT_FOUND
                timestamp: '2026-08-21T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/moderation/messages/{messageId}':
    delete:
      tags:
        - Moderation
      summary: 移除違規訊息
      description: |
        需 `BACKEND:MODERATION:EDIT` 權限。

        **不要求該訊息被檢舉過**：管理員可能從私訊、主動巡邏等管道發現違規內容。
        移除的授權來自 RBAC，不來自檢舉的存在。

        移除採**軟刪除**：該則與它的 `seq` 會保留、內容保留在資料庫（供調查與申訴），
        但前台看不到內容。它在歷史與斷線補齊中仍會出現，帶 `removedAt`。

        **與使用者撤回是不同的標記**（`removedAt` vs `retractedAt`）：
        兩者對客戶端的語意不同（「因違反規範被移除」vs「對方自己收回」）。
        兩個標記可以同時存在，呈現上以移除優先。

        **冪等**：重複移除回 `204`，不重複推播、不覆寫原本的移除時間。

        成功時房間成員會收到 `server:messageRemoved`（payload 不含內容）。
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 已移除（無回應內容）；重複移除同樣回 204
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 訊息不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 訊息不存在或不是你發送的
                code: CHAT_MESSAGE_NOT_FOUND
                timestamp: '2026-08-21T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/moderation/messages/{messageId}/restore':
    post:
      tags:
        - Moderation
      summary: 還原被誤移除的訊息
      description: |
        需 `BACKEND:MODERATION:EDIT` 權限。

        誤判在審閱情境是真實的——沒有回頭路會讓管理員傾向不敢處理，
        而一個不敢用的工具等於沒有工具。

        **不影響使用者自己的撤回狀態**：若該則原本已被發送者撤回，
        還原後它會回到「已收回」而非完全正常。推播的 payload 會帶還原後的 `retractedAt`，
        讓客戶端知道要顯示哪一種。

        **還原同樣留稽核**：`removedAt` 清除後，「這則曾被移除過」就不再留在訊息列上，
        而反覆移除再還原本身就是可疑行為。

        **冪等**：還原未被移除的訊息回 `204`，不推播。
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 已還原（無回應內容）；未被移除時同樣回 204
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 訊息不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 訊息不存在或不是你發送的
                code: CHAT_MESSAGE_NOT_FOUND
                timestamp: '2026-08-21T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/moderation/members/{memberId}/suspend':
    post:
      tags:
        - Moderation
      summary: 停權成員（審閱側）
      description: |
        需 `BACKEND:MODERATION:EDIT` 權限。

        **停的是前台使用者（`users`），不是後台管理員。** 審閱處理的是聊天裡的違規行為，
        而聊天的參與者是前台使用者。與帳號管理的
        `PATCH /api/admin/members/{id} { "status": false }` 停的是**不同的東西**。

        與會員管理側的 `POST /api/admin/front-users/{userId}/suspend` 則是**同一個 use case**，
        差別只在權限碼——分開的是授權而不是行為。

        停權會做四件事：帳號停用、`tokenVersion` 遞增（讓所有裝置立即失效）、
        **既有的 WebSocket 連線被斷開**、寫入稽核。

        第三項是關鍵：連線層的認證只在 handshake 執行一次，之後的事件只驗資源層級的授權。
        不主動撤銷的話，**被停權的人只要連線還開著就能繼續送訊息**。
        被斷線的客戶端會先收到 `server:sessionRevoked`，據此停止自動重連。

        **冪等**：對已停用的帳號再次停權回 `204`，不重複斷線也不重複稽核。
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 已停權（無回應內容）；已停用時同樣回 204
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            該前台使用者不存在。**包含「傳入後台管理員的 ID」**——
            管理員與前台使用者是兩個不相交的身分空間，那個 ID 在 `users` 裡查不到。
            因此「停權自己」在本端點是 404 而非 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 找不到帳號
                code: MEMBER_NOT_FOUND
                timestamp: '2026-08-21T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/moderation/members/{memberId}/reinstate':
    post:
      tags:
        - Moderation
      summary: 解除停權
      description: |
        需 `BACKEND:MODERATION:EDIT` 權限。恢復該成員的帳號，使用者重新登入即可。

        **不會主動通知或恢復連線**：他的連線已經斷了、token 也失效了，
        沒有任何管道可以推給他。要通知得走 email 或推播通知，那是另一個主題。

        **解除同樣留稽核**：`users.status` 只留下「現在是什麼狀態」，
        留不下「誰在什麼時候改的」，而反覆停權再解除本身就是可疑行為。

        **冪等**：對未停用的帳號解除回 `204`，不重複稽核。
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 已解除（無回應內容）；本來就啟用時同樣回 204
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 成員不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 找不到帳號
                code: MEMBER_NOT_FOUND
                timestamp: '2026-08-21T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /moderation/dashboard:
    get:
      tags:
        - Dashboard
      summary: 查詢營運快照
      description: |
        需 `BACKEND:MODERATION:VIEW` 權限。

        **只有聚合數字**——沒有 email、沒有房間名稱、沒有訊息內容。
        儀表板回答「現在怎麼樣」，要看是誰、是哪個房間都該去對應的列表頁。

        本端點**不寫稽核**：回應不含任何個人或訊息內容。
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required:
                      - onlineMembers
                      - pendingReports
                      - totalRooms
                      - totalMembers
                      - messagesToday
                      - generatedAt
                    properties:
                      onlineMembers:
                        type: integer
                        description: |
                          目前有連線的**成員數**（不是連線數）——一個人開三個裝置算一個。
                          跨實例，來源是 Redis。
                      pendingReports:
                        type: integer
                        description: 待處理的檢舉數
                      totalRooms:
                        type: integer
                      totalMembers:
                        type: integer
                        description: 未軟刪除的成員數
                      messagesToday:
                        type: integer
                        description: |
                          今日訊息數。**日界依 `APP_TIMEZONE` 而非 UTC**——
                          用 UTC 會讓這個數字在台灣時間早上八點莫名其妙歸零。
                      generatedAt:
                        type: string
                        format: date-time
                        description: |
                          產生這組數字的時間。一組沒有時間戳的即時數字，
                          在連線中斷後看起來與即時數字一模一樣——呼叫端要能顯示「最後更新於」。
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /moderation/dashboard/stream:
    get:
      tags:
        - Dashboard
      summary: 推送營運快照（SSE）
      description: |
        需 `BACKEND:MODERATION:VIEW` 權限。

        以 Server-Sent Events 每 `DASHBOARD_STREAM_INTERVAL_SEC` 秒推送一次快照，
        內容與 `GET /moderation/dashboard` 相同。連線建立時**立即推一次**，
        不讓客戶端空等一個間隔。

        回應**不套** `{ success, data, timestamp }` 外殼——SSE 的每一筆是獨立事件，
        而外殼是為「一次請求一次回應」設計的。

        **查詢是實例級的**：同一個實例上不論有 1 個或 10 個訂閱者，
        每個週期只查一次資料庫。沒有訂閱者時停止查詢。

        **客戶端注意**：原生 `EventSource` 無法帶自訂 header，
        而本 API 以 `Authorization: Bearer` 認證。請用 `fetch` +
        `response.body.getReader()` 自行讀取；**不要**把 token 放進 query string。
      responses:
        '200':
          description: 事件串流
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  每筆事件的形狀為 `data: <snapshot JSON>`，兩個換行分隔。
                  snapshot 的欄位與 `GET /moderation/dashboard` 的 `data` 相同。
              example: |
                data: {"onlineMembers":12,"pendingReports":3,"totalRooms":48,"totalMembers":156,"messagesToday":1204,"generatedAt":"2026-08-22T06:00:00.000Z"}
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /moderation/rooms:
    get:
      tags:
        - Moderation
      summary: 查詢聊天室列表
      description: |
        需 `BACKEND:MODERATION:VIEW` 權限。

        **回應不含任何訊息內容**——總覽回答的是「這個房間發生了什麼」，
        不是「他們說了什麼」。要看內容仍然只能經由檢舉，那保持了「看內容必須有理由」。
      parameters:
        - name: roomType
          in: query
          required: false
          schema:
            type: string
            enum:
              - DIRECT
              - GROUP
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required:
                      - list
                      - meta
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          required:
                            - roomId
                            - roomType
                            - name
                            - memberCount
                            - messageCount
                            - createdAt
                          properties:
                            roomId:
                              type: string
                              format: uuid
                            roomType:
                              type: string
                              enum:
                                - DIRECT
                                - GROUP
                            name:
                              type: string
                              nullable: true
                              description: 群組名稱；私聊為 null（顯示名稱由對方決定，不落庫）
                            memberCount:
                              type: integer
                            messageCount:
                              type: integer
                              description: |
                                **歷史訊息總數**，取自 `chat_rooms.last_seq`。

                                語意是「這個房間曾經有多少則」——**含已撤回與已被管理員移除的訊息**，
                                不是「目前存在幾則」。訊息列永遠不會被刪除（刪了會讓 seq 出現洞，
                                補齊的客戶端無法區分「被清掉」與「我漏收了」），因此兩者目前相等，
                                但 last_seq 不需要多一次查詢。
                            createdAt:
                              type: string
                              format: date-time
                      meta:
                        type: object
                        required:
                          - page
                          - limit
                          - total
                          - totalPages
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          totalPages:
                            type: integer
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: roomType 不是 DIRECT 或 GROUP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 資料驗證失敗
                code: VALIDATION_ERROR
                timestamp: '2026-08-21T06:00:00.000Z'
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
