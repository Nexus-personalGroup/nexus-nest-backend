  /attachments:
    post:
      tags:
        - Attachments
      summary: 上傳附件
      description: |
        multipart/form-data 上傳單一檔案。驗證 MIME 白名單 / 大小上限 / folder 白名單；
        副檔名一律由驗過的 MIME 推導（不取原始檔名，擋 stored XSS）。回傳附件 id 與可存取 URL。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - folder
                - relatedTable
                - relatedId
              properties:
                file:
                  type: string
                  format: binary
                  description: 上傳檔案（欄位名固定為 file）
                folder:
                  type: string
                  enum:
                    - avatars
                    - attachments
                  description: 上傳資料夾（白名單）
                relatedTable:
                  type: string
                  description: 附屬的資料表（如 members）
                  example: members
                relatedId:
                  type: string
                  description: 附屬的紀錄 id
      responses:
        '201':
          description: 上傳成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - id
                      - url
                    properties:
                      id:
                        type: string
                        format: uuid
                      url:
                        type: string
                        description: 可存取的檔案 URL（local 為 static、s3 為公開/預簽 URL）
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
  '/attachments/{id}':
    delete:
      tags:
        - Attachments
      summary: 刪除附件
      description: 依 id 刪除附件（同時刪除 storage 檔案與 DB 紀錄）。找不到回 404。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 附件 id
      responses:
        '204':
          description: 刪除成功（無內容）
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          description: |
            缺 `BACKEND:ATTACHMENT:EDIT` 權限（code: FORBIDDEN），
            或具權限但非上傳者且非 SUPERADMIN（code: ATTACHMENT_FORBIDDEN）。
            擁有者檢查不可省——刪除不可逆且會移除實體檔案，而附件 ID 會隨上傳回應外流。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 沒有權限刪除此附件
                code: ATTACHMENT_FORBIDDEN
                timestamp: '2024-01-01T00:00:00.000Z'
        '404':
          description: 找不到附件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
