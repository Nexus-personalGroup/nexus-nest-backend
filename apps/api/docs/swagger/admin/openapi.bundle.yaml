                        type: array
                        items:
                          type: object
                          required:
                            - action
                            - createdAt
                          properties:
                            action:
                              type: string
                              enum:
                                - ROOM_JOINED
                                - ROOM_LEFT
                                - MESSAGE_RETRACTED
                                - MESSAGE_RETRACT_REJECTED
                                - MESSAGE_RATE_LIMITED
                                - REPORT_SUBMITTED
                                - REPORT_VIEWED
                                - MESSAGE_REMOVED
                                - MESSAGE_RESTORED
                                - MEMBER_SUSPENDED
                                - MEMBER_REINSTATED
                            roomId:
                              type: string
                              format: uuid
                              nullable: true
                            targetMemberId:
                              type: string
                              format: uuid
                              nullable: true
                            targetMessageId:
                              type: string
                              format: uuid
                              nullable: true
                            createdAt:
                              type: string
                              format: date-time
                      meta:
                        type: object
                        required:
                          - page
                          - limit
                          - total
                          - totalPages
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          totalPages:
                            type: integer
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      tags:
        - Auth
      summary: 登入
      description: |
        使用 Email 與密碼登入，成功後取得 JWT Access Token 與 Refresh Token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: 電子郵件
                  example: test@example.com
                password:
                  type: string
                  format: password
                  description: 密碼
                  example: mypassword123
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: 登入結果
                    required:
                      - accessToken
                      - refreshToken
                      - accessTokenExpiresIn
                      - refreshTokenExpiresIn
                      - member
                    properties:
                      accessToken:
                        type: string
                        description: Access Token
                      refreshToken:
                        type: string
                        description: Refresh Token
                      accessTokenExpiresIn:
                        type: integer
                        description: Access Token 絕對有效期（秒）
                      refreshTokenExpiresIn:
                        type: integer
                        description: Refresh Token 絕對有效期（秒）
                      member:
                        type: object
                        description: 帳號摘要
                        required:
                          - id
                          - email
                          - member
                          - roleName
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: 帳號 ID
                          email:
                            type: string
                            format: email
                            description: Email
                          member:
                            type: string
                            description: 名稱
                          roleName:
                            type: string
                            description: 所屬角色名稱
                  timestamp:
                    type: string
                    format: date-time
              example:
                success: true
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  accessTokenExpiresIn: 900
                  refreshTokenExpiresIn: 604800
                  member:
                    id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    email: test@example.com
                    member: Alan
                    roleName: ADMIN
                timestamp: '2024-01-01T00:00:00.000Z'
        '401':
          description: 帳號或密碼錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 帳號或密碼錯誤
                code: UNAUTHORIZED
                timestamp: '2024-01-01T00:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: 登出
      description: |
        登出並將 Access Token 加入黑名單。
        若同時傳入 Refresh Token，也會一併加入黑名單。
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Refresh Token（選填，一併廢棄）
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '204':
          description: 登出成功（無回應內容）
        '401':
          $ref: '#/components/responses/NoToken'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: 更新 Access Token
      description: |
        使用 Refresh Token 取得新的 Access Token 與新的 Refresh Token（rotation）。
        舊 Refresh Token 會立即加入黑名單；如果同一個舊 Refresh Token 再次被用 → 401。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: Refresh Token
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: 更新後的 token 雙包
                    required:
                      - accessToken
                      - accessTokenExpiresIn
                      - refreshToken
                      - refreshTokenExpiresIn
                    properties:
                      accessToken:
                        type: string
                        description: 新的 Access Token
                      accessTokenExpiresIn:
                        type: integer
                        description: Access Token 絕對有效期（秒）
                      refreshToken:
                        type: string
                        description: 新的 Refresh Token（舊 token 已加入黑名單）
                      refreshTokenExpiresIn:
                        type: integer
                        description: Refresh Token 絕對有效期（秒）
                  timestamp:
                    type: string
                    format: date-time
              example:
                success: true
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  accessTokenExpiresIn: 7200
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshTokenExpiresIn: 604800
                timestamp: '2024-01-01T00:00:00.000Z'
        '401':
          description: Refresh Token 無效或已失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Refresh Token 無效
                code: INVALID_REFRESH_TOKEN
                timestamp: '2024-01-01T00:00:00.000Z'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: 忘記密碼
      description: |
        傳送密碼重設信件。無論 Email 是否存在，回應皆相同（防止帳號列舉）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: 電子郵件
                  example: test@example.com
      responses:
        '204':
          description: |
            請求已接受（無回應內容）。信箱是否存在皆回相同結果，
            提示文案由前端固定呈現——後端不回任何足以區分的內容。
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: 重設密碼
      description: |
        使用密碼重設 Token 設定新密碼。Token 為單次使用，過期後失效。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  description: 密碼重設 Token（來自信件連結）
                  example: abc123def456
                newPassword:
                  type: string
                  format: password
                  description: 新密碼
                  example: NewPassword123!
      responses:
        '204':
          description: 密碼重設成功（無回應內容）
        '400':
          description: |
            Token 無效或已過期，或新密碼未通過複雜度檢核、欄位缺漏。
            Token 是否有效刻意不以狀態碼區分，避免成為「這枚 Token 存不存在」的探測管道。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 重設密碼連結無效或已過期
                code: BAD_REQUEST
                timestamp: '2024-01-01T00:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
