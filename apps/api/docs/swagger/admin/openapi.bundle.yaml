            minimum: 1
            maximum: 200
        - name: email
          in: query
          required: false
          schema:
            type: string
          description: email 模糊搜尋（不分大小寫）
        - name: displayName
          in: query
          required: false
          schema:
            type: string
          description: 顯示名稱模糊搜尋（不分大小寫）
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: 啟用狀態。**省略即不過濾**；非 true/false 回 400
        - name: verified
          in: query
          required: false
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: 信箱驗證狀態。`true` 對應「已驗證」。**省略即不過濾**
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required:
                      - list
                      - meta
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          description: |
                            後台視角的前台使用者。**不含 `password` 與 `tokenVersion`**——
                            前者是認證流程專屬、後者是內部機制，兩者都沒有理由離開伺服器。
                          required:
                            - id
                            - email
                            - displayName
                            - avatarUrl
                            - status
                            - emailVerifiedAt
                            - lastSeenAt
                            - createdAt
                          properties:
                            id:
                              type: string
                              format: uuid
                            email:
                              type: string
                              format: email
                            displayName:
                              type: string
                            avatarUrl:
                              type: string
                              nullable: true
                            status:
                              type: boolean
                              description: 帳號啟用狀態；false 代表已停權
                            emailVerifiedAt:
                              type: string
                              format: date-time
                              nullable: true
                              description: 信箱驗證時間；null 表示尚未驗證
                            lastSeenAt:
                              type: string
                              format: date-time
                              nullable: true
                              description: |
                                **最後一次登入或換發 token 的時間**，不是「最後上線」——
                                它只在認證流程更新，不隨 WS 心跳前進。顯示時要標示清楚。
                            createdAt:
                              type: string
                              format: date-time
                      meta:
                        type: object
                        required:
                          - page
                          - limit
                          - total
                          - totalPages
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          totalPages:
                            type: integer
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: query 參數不符 schema（例如 status=yes）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 資料驗證失敗
                code: VALIDATION_ERROR
                timestamp: '2026-08-24T06:00:00.000Z'
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/front-users/{userId}':
    get:
      tags:
        - FrontUsers
      summary: 查詢單一前台會員
      description: |
        需 `BACKEND:FRONT_USER:VIEW` 權限。

        **與 `GET /moderation/members/{memberId}` 是兩支不同的端點**，各自回答不同的問題：
        本端點回答「這個**帳號**是什麼狀態」，審閱側的成員概覽回答
        「這個**人**在聊天裡做了什麼」。後者刻意只回八個欄位且不含帳號資料——
        它的授權是 `BACKEND:MODERATION:VIEW`，把帳號面補進去就是繞過另一個權限的邊界。

        傳入後台管理員的 ID 會得到 404：那個 ID 在 `users` 裡不存在。
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required:
                      - id
                      - email
                      - displayName
                      - avatarUrl
                      - status
                      - emailVerifiedAt
                      - lastSeenAt
                      - createdAt
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      displayName:
                        type: string
                      avatarUrl:
                        type: string
                        nullable: true
                      status:
                        type: boolean
                      emailVerifiedAt:
                        type: string
                        format: date-time
                        nullable: true
                      lastSeenAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: 最後一次登入或換發 token 的時間，不是「最後上線」
                      createdAt:
                        type: string
                        format: date-time
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 該前台使用者不存在、已軟刪除，或那是一個後台管理員的 ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 找不到帳號
                code: MEMBER_NOT_FOUND
                timestamp: '2026-08-24T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/front-users/{userId}/suspend':
    post:
      tags:
        - FrontUsers
      summary: 停權前台會員
      description: |
        需 `BACKEND:FRONT_USER:EDIT` 權限。

        **與審閱側的 `POST /moderation/members/{memberId}/suspend` 呼叫同一個 use case**，
        效果完全相同：帳號停用、`tokenVersion` 遞增、既有的 WebSocket 連線被斷開、
        寫入 `MEMBER_SUSPENDED` 稽核。

        兩個入口分開的是**授權**而不是行為——「能瀏覽客戶名單的客服」與
        「能看檢舉內容的審閱者」在真實團隊裡經常不是同一群。各自實作會讓斷線與稽核的
        行為分歧，而分歧的那一邊不會有人發現。

        被斷線的客戶端會先收到 `server:sessionRevoked`，據此停止自動重連。

        **冪等**：對已停用的帳號再次停權回 `204`，不重複斷線也不重複稽核。
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 已停權（無回應內容）；已停用時同樣回 204
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 該前台使用者不存在或已軟刪除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 找不到帳號
                code: MEMBER_NOT_FOUND
                timestamp: '2026-08-24T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/front-users/{userId}/reinstate':
    post:
      tags:
        - FrontUsers
      summary: 解除前台會員的停權
      description: |
        需 `BACKEND:FRONT_USER:EDIT` 權限。與審閱側的解除呼叫同一個 use case。

        解除會留下 `MEMBER_REINSTATED` 稽核，但**不推播任何事件、也不恢復任何連線**：
        被停權者的連線早已斷開、token 也已失效，沒有任何管道推得到他。他重新登入即可。

        注意**舊的 token 仍然無效**——停權當下已經遞增過 `tokenVersion`。

        **冪等**：對未停權的帳號呼叫回 `204`，不寫稽核。
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 已解除（無回應內容）；本來就啟用時同樣回 204
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 該前台使用者不存在或已軟刪除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 找不到帳號
                code: MEMBER_NOT_FOUND
                timestamp: '2026-08-24T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/front-users/{userId}/force-logout':
    post:
      tags:
        - FrontUsers
      summary: 強制前台會員登出
      description: |
        需 `BACKEND:FRONT_USER:EDIT` 權限。

        讓該使用者所有裝置的 token 立即失效並斷開既有的 WebSocket 連線，
        **但不改變帳號的 `status`**。

        **這與停權是兩件不同的事，不要用「停權再解除」代替**：

        | 動作 | 語意 | status | 能否重新登入 |
        | --- | --- | --- | --- |
        | 停權 | 這個人違規 | 變 false | 不能 |
        | 強制登出 | 這個帳號可能被別人拿到了 | 不變 | 能 |

        用停權代替會在稽核裡留下一筆**不實的違規紀錄**，而稽核的用途正是事後回答
        「這個人被怎麼對待過」。本端點寫的是 `MEMBER_FORCE_LOGGED_OUT`。

        **刻意不冪等**：每次呼叫都遞增 `tokenVersion` 並寫一筆稽核。
        「再登出一次」是有意義的重複動作——第一次之後對方又登入了。

        **對已停權的帳號同樣有效**：兩件事互相獨立。
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 已強制登出（無回應內容）
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 該前台使用者不存在或已軟刪除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 找不到帳號
                code: MEMBER_NOT_FOUND
                timestamp: '2026-08-24T06:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      tags:
        - Auth
      summary: 登入
      description: |
        使用 Email 與密碼登入，成功後取得 JWT Access Token 與 Refresh Token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: 電子郵件
                  example: test@example.com
                password:
                  type: string
                  format: password
                  description: 密碼
                  example: mypassword123
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: 登入結果
                    required:
                      - accessToken
                      - refreshToken
                      - accessTokenExpiresIn
                      - refreshTokenExpiresIn
                      - member
                    properties:
                      accessToken:
                        type: string
                        description: Access Token
                      refreshToken:
                        type: string
                        description: Refresh Token
                      accessTokenExpiresIn:
                        type: integer
                        description: Access Token 絕對有效期（秒）
                      refreshTokenExpiresIn:
                        type: integer
                        description: Refresh Token 絕對有效期（秒）
                      member:
                        type: object
                        description: 帳號摘要
                        required:
                          - id
                          - email
                          - member
                          - roleName
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: 帳號 ID
                          email:
                            type: string
                            format: email
                            description: Email
                          member:
                            type: string
                            description: 名稱
                          roleName:
                            type: string
                            description: 所屬角色名稱
                  timestamp:
                    type: string
                    format: date-time
              example:
                success: true
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  accessTokenExpiresIn: 900
                  refreshTokenExpiresIn: 604800
                  member:
                    id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    email: test@example.com
                    member: Alan
                    roleName: ADMIN
                timestamp: '2024-01-01T00:00:00.000Z'
        '401':
          description: 帳號或密碼錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 帳號或密碼錯誤
                code: UNAUTHORIZED
                timestamp: '2024-01-01T00:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: 登出
      description: |
        登出並將 Access Token 加入黑名單。
        若同時傳入 Refresh Token，也會一併加入黑名單。
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Refresh Token（選填，一併廢棄）
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '204':
          description: 登出成功（無回應內容）
        '401':
          $ref: '#/components/responses/NoToken'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: 更新 Access Token
      description: |
        使用 Refresh Token 取得新的 Access Token 與新的 Refresh Token（rotation）。
        舊 Refresh Token 會立即加入黑名單；如果同一個舊 Refresh Token 再次被用 → 401。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: Refresh Token
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: 更新後的 token 雙包
                    required:
                      - accessToken
                      - accessTokenExpiresIn
                      - refreshToken
                      - refreshTokenExpiresIn
                    properties:
                      accessToken:
                        type: string
                        description: 新的 Access Token
                      accessTokenExpiresIn:
                        type: integer
                        description: Access Token 絕對有效期（秒）
                      refreshToken:
                        type: string
                        description: 新的 Refresh Token（舊 token 已加入黑名單）
                      refreshTokenExpiresIn:
                        type: integer
                        description: Refresh Token 絕對有效期（秒）
                  timestamp:
                    type: string
                    format: date-time
              example:
                success: true
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  accessTokenExpiresIn: 7200
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshTokenExpiresIn: 604800
                timestamp: '2024-01-01T00:00:00.000Z'
        '401':
          description: Refresh Token 無效或已失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Refresh Token 無效
                code: INVALID_REFRESH_TOKEN
                timestamp: '2024-01-01T00:00:00.000Z'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: 忘記密碼
      description: |
        傳送密碼重設信件。無論 Email 是否存在，回應皆相同（防止帳號列舉）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: 電子郵件
                  example: test@example.com
      responses:
        '204':
          description: |
            請求已接受（無回應內容）。信箱是否存在皆回相同結果，
            提示文案由前端固定呈現——後端不回任何足以區分的內容。
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: 重設密碼
      description: |
        使用密碼重設 Token 設定新密碼。Token 為單次使用，過期後失效。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  description: 密碼重設 Token（來自信件連結）
                  example: abc123def456
                newPassword:
                  type: string
                  format: password
                  description: 新密碼
                  example: NewPassword123!
      responses:
        '204':
          description: 密碼重設成功（無回應內容）
        '400':
          description: |
            Token 無效或已過期，或新密碼未通過複雜度檢核、欄位缺漏。
            Token 是否有效刻意不以狀態碼區分，避免成為「這枚 Token 存不存在」的探測管道。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 重設密碼連結無效或已過期
                code: BAD_REQUEST
                timestamp: '2024-01-01T00:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
