tags: [Members]
summary: 帳號詳情
description: |
  取得單一帳號詳情（供編輯 Modal 帶入資料）。
  需要 `BACKEND:ACCOUNT:VIEW` 權限。
  需要 JWT Bearer Token 認證。

security:
  - bearerAuth: []

parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
    description: 帳號 ID

responses:
  '200':
    description: 查詢成功
    content:
      application/json:
        schema:
          type: object
          required: [success, data, timestamp]
          properties:
            success:
              type: boolean
              example: true
            data:
              type: object
              description: 帳號詳細
              properties:
                id:
                  type: string
                  format: uuid
                  description: 帳號 ID
                email:
                  type: string
                  format: email
                  description: Email
                member:
                  type: string
                  description: 名稱
                roleId:
                  type: string
                  format: uuid
                  description: 所屬角色 ID
                roleName:
                  type: string
                  description: 角色名稱
                status:
                  type: boolean
                  description: 啟用狀態
                isDefault:
                  type: boolean
                  description: 預設帳號旗標（true 時不可刪除）
                createdAt:
                  type: string
                  format: date-time
                  description: 建立時間（UTC）
                updatedAt:
                  type: string
                  format: date-time
                  description: 更新時間（UTC）
                lastLoginAt:
                  type: string
                  format: date-time
                  nullable: true
                  description: 最後登入時間（UTC，可 null）
            timestamp:
              type: string
              format: date-time

  '401':
    $ref: '../openapi.yaml#/components/responses/NoToken'
  '403':
    $ref: '../openapi.yaml#/components/responses/Forbidden'
  '404':
    description: 找不到帳號
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
        example:
          success: false
          message: 找不到帳號
          code: MEMBER_NOT_FOUND
          timestamp: '2024-01-01T00:00:00.000Z'
  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
