tags: [Members]
summary: 刪除帳號
description: |
  帳號軟刪除（logical delete）。資料列保留，信箱改為 `原值_時間戳記` 以釋放唯一約束。
  需要 `BACKEND:ACCOUNT:EDIT` 權限。
  需要 JWT Bearer Token 認證。

security:
  - bearerAuth: []

parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
    description: 帳號 ID

responses:
  '204':
    description: 刪除成功（無 body）
  '400':
    description: 不可刪除自己或預設帳號不可刪除
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
        examples:
          cannotDeleteSelf:
            summary: 不可刪除自己
            value:
              success: false
              message: 不可刪除登入中的自己帳號
              code: CANNOT_DELETE_SELF
              timestamp: '2024-01-01T00:00:00.000Z'
          defaultMember:
            summary: 預設帳號不可刪除
            value:
              success: false
              message: 預設帳號不可刪除
              code: DEFAULT_MEMBER_NOT_DELETABLE
              timestamp: '2024-01-01T00:00:00.000Z'
  '401':
    $ref: '../openapi.yaml#/components/responses/NoToken'
  '403':
    $ref: '../openapi.yaml#/components/responses/Forbidden'
  '404':
    description: 找不到帳號
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
        example:
          success: false
          message: 找不到帳號
          code: MEMBER_NOT_FOUND
          timestamp: '2024-01-01T00:00:00.000Z'
  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
