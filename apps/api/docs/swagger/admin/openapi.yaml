openapi: 3.0.0

info:
  title: Nexus 後台 (Admin) API
  version: 1.0.0
  description: |
    後台管理 API 文件。

    **所有端點都需要後台的 Bearer Token**（由 `POST /admin/auth/login` 取得），
    並依端點各自宣告的權限碼授權（`BACKEND:*`）。

    ⚠️ **前台（`/api/front/*`）的 token 在這裡一律無效**——兩側各自使用不同的
    簽發 secret，簽章驗證就會失敗，不是權限不足。

    本文件涵蓋的「會員」有**兩種、分屬兩張互不相交的表**，別看混了：
    `Members` 是後台管理員（`members`），`FrontUsers` 是聊天服務的使用者（`users`）。

servers:
  - url: http://localhost:3000/api/admin
    description: 本地開發環境（後台 API）

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        使用 Access Token 進行身份驗證

        格式: Bearer {accessToken}

  schemas:
    # ===== 通用回應格式 =====
    SuccessResponse:
      type: object
      description: 通用成功回應格式
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          description: 操作是否成功
          example: true
        data:
          type: object
          description: 回應資料
          nullable: true
        timestamp:
          type: string
          format: date-time
          description: 回應時間
          example: '2024-01-01T00:00:00.000Z'

    ErrorResponse:
      type: object
      description: 通用錯誤回應格式
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          description: 操作是否成功
          example: false
        message:
          type: string
          description: 錯誤訊息
          example: 發生錯誤
        code:
          type: string
          description: 錯誤代碼
          example: ERROR_CODE
        timestamp:
          type: string
          format: date-time
          description: 回應時間
          example: '2024-01-01T00:00:00.000Z'

  responses:
    # 400 Bad Request
    BadRequest:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 請求參數錯誤
            code: BAD_REQUEST
            timestamp: '2024-01-01T00:00:00.000Z'

    # 401 Unauthorized
    NoToken:
      description: 缺少授權憑證
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 缺少授權憑證，請先登入
            code: NO_TOKEN
            timestamp: '2024-01-01T00:00:00.000Z'

    TokenRevoked:
      description: Token 已登出或失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 已登出或失效
            code: TOKEN_REVOKED
            timestamp: '2024-01-01T00:00:00.000Z'

    TokenExpired:
      description: Token 已過期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 已過期
            code: TOKEN_EXPIRED
            timestamp: '2024-01-01T00:00:00.000Z'

    InvalidToken:
      description: Token 無效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 無效
            code: INVALID_TOKEN
            timestamp: '2024-01-01T00:00:00.000Z'

    # 403 Forbidden
    Forbidden:
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 權限不足
            code: FORBIDDEN
            timestamp: '2024-01-01T00:00:00.000Z'

    # 404 Not Found
    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 資源不存在
            code: NOT_FOUND
            timestamp: '2024-01-01T00:00:00.000Z'

    # 409 Conflict
    Conflict:
      description: 資源已存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 資源已存在
            code: CONFLICT
            timestamp: '2024-01-01T00:00:00.000Z'

    # 500 Internal Server Error
    InternalServerError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 伺服器發生未預期錯誤
            code: INTERNAL_SERVER_ERROR
            timestamp: '2024-01-01T00:00:00.000Z'

# 分組的順序就是這裡的順序（Swagger UI 依宣告排，不是字母序）。
# 排法對齊後台 Sidebar 的心智模型：先認證、再帳號與權限、再營運、最後基礎設施。
# **新增 tag 一定要補進這裡**——沒宣告的 tag 仍然會顯示，但會掉到最後面、
# 沒有任何說明，而那看起來只是「順序怪怪的」，不像是漏掉了什麼
tags:
  - name: Auth
    description: 後台認證：登入、登出、換發 token、忘記與重設密碼
  - name: Profile
    description: 目前登入者自己的資料
  - name: Members
    description: 後台帳號管理（`members`）——**同事的帳號**，不是聊天的使用者
  - name: Roles
    description: 角色與權限碼的指派
  - name: FrontUsers
    description: >-
      前台會員管理（`users`）——**聊天服務的使用者**。與 Members 是兩個不相交的
      帳號體系，權限碼也分開（`BACKEND:FRONT_USER:*`）
  - name: Moderation
    description: >-
      檢舉審閱：佇列、詳情、判定、訊息移除／還原、成員行為時間軸、
      聊天室總覽，以及審閱側的停權入口
  - name: Dashboard
    description: 營運總覽的即時數字（快照與 SSE 串流）
  - name: Attachments
    description: 附件上傳與刪除
  - name: Security
    description: IP 白名單／黑名單與帳號解鎖（SUPERADMIN）

paths:
  /moderation/reports:
    get:
      $ref: './moderation/list-reports.yaml'

  /moderation/reports/{reportId}:
    get:
      $ref: './moderation/get-report.yaml'
    patch:
      $ref: './moderation/review-report.yaml'

  /moderation/messages/{messageId}:
    delete:
      $ref: './moderation/remove-message.yaml'

  /moderation/messages/{messageId}/restore:
    post:
      $ref: './moderation/restore-message.yaml'

  /moderation/members/{memberId}/suspend:
    post:
      $ref: './moderation/suspend-member.yaml'

  /moderation/members/{memberId}/reinstate:
    post:
      $ref: './moderation/reinstate-member.yaml'

  /moderation/dashboard:
    get:
      $ref: './dashboard/snapshot.yaml'

  /moderation/dashboard/stream:
    get:
      $ref: './dashboard/stream.yaml'

  /moderation/rooms:
    get:
      $ref: './moderation/list-rooms.yaml'

  /moderation/rooms/{roomId}:
    get:
      $ref: './moderation/room-detail.yaml'

  /moderation/members/{memberId}:
    get:
      $ref: './moderation/member-profile.yaml'

  /moderation/members/{memberId}/reports:
    get:
      $ref: './moderation/member-reports.yaml'

  /moderation/members/{memberId}/rooms:
    get:
      $ref: './moderation/member-rooms.yaml'

  /moderation/members/{memberId}/timeline:
    get:
      $ref: './moderation/member-timeline.yaml'

  /front-users:
    get:
      $ref: './front-users/list.yaml'

  /front-users/{userId}:
    get:
      $ref: './front-users/detail.yaml'

  /front-users/{userId}/suspend:
    post:
      $ref: './front-users/suspend.yaml'

  /front-users/{userId}/reinstate:
    post:
      $ref: './front-users/reinstate.yaml'

  /front-users/{userId}/force-logout:
    post:
      $ref: './front-users/force-logout.yaml'

  /auth/login:
    post:
      $ref: './auth/login.yaml'

  /auth/logout:
    post:
      $ref: './auth/logout.yaml'

  /auth/refresh:
    post:
      $ref: './auth/refresh.yaml'

  /auth/forgot-password:
    post:
      $ref: './auth/forgot-password.yaml'

  /auth/reset-password:
    post:
      $ref: './auth/reset-password.yaml'

  /roles:
    get:
      $ref: './roles/list.yaml'
    post:
      $ref: './roles/create.yaml'

  /roles/permissions:
    get:
      $ref: './roles/permissions.yaml'

  /roles/{id}:
    get:
      $ref: './roles/get.yaml'
    patch:
      $ref: './roles/update.yaml'
    delete:
      $ref: './roles/delete.yaml'

  /me:
    get:
      $ref: './profile/get-me.yaml'

  /members:
    get:
      $ref: './members/list.yaml'
    post:
      $ref: './members/create.yaml'

  /members/role/options:
    get:
      $ref: './members/role-options.yaml'

  /members/role/options/{id}:
    get:
      $ref: './members/role-option.yaml'

  /members/{id}:
    get:
      $ref: './members/get.yaml'
    patch:
      $ref: './members/update.yaml'
    delete:
      $ref: './members/delete.yaml'

  /security/ip-whitelist:
    get:
      $ref: './security/ip-whitelist-list.yaml'
    post:
      $ref: './security/ip-whitelist-add.yaml'

  /security/ip-whitelist/{id}:
    get:
      $ref: './security/ip-whitelist-get.yaml'
    patch:
      $ref: './security/ip-whitelist-update.yaml'
    delete:
      $ref: './security/ip-whitelist-delete.yaml'

  /security/ip-blacklist:
    get:
      $ref: './security/ip-blacklist-list.yaml'
    post:
      $ref: './security/ip-blacklist-add.yaml'

  /security/ip-blacklist/{id}:
    get:
      $ref: './security/ip-blacklist-get.yaml'
    patch:
      $ref: './security/ip-blacklist-update.yaml'
    delete:
      $ref: './security/ip-blacklist-delete.yaml'

  /security/unlock-account:
    post:
      $ref: './security/unlock-account.yaml'

  /attachments:
    post:
      $ref: './attachments/upload.yaml'

  /attachments/{id}:
    delete:
      $ref: './attachments/delete.yaml'
