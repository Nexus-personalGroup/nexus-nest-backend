      $ref: './moderation/review-report.yaml'

  /moderation/messages/{messageId}:
    delete:
      $ref: './moderation/remove-message.yaml'

  /moderation/messages/{messageId}/restore:
    post:
      $ref: './moderation/restore-message.yaml'

  /moderation/members/{memberId}/timeline:
    get:
      $ref: './moderation/member-timeline.yaml'

  /auth/login:
    post:
      $ref: './auth/login.yaml'

  /auth/logout:
    post:
      $ref: './auth/logout.yaml'

  /auth/refresh:
    post:
      $ref: './auth/refresh.yaml'

  /auth/forgot-password:
    post:
      $ref: './auth/forgot-password.yaml'

  /auth/reset-password:
    post:
      $ref: './auth/reset-password.yaml'

  /roles:
    get:
      $ref: './roles/list.yaml'
    post:
      $ref: './roles/create.yaml'

  /roles/permissions:
    get:
      $ref: './roles/permissions.yaml'

  /roles/{id}:
    get:
      $ref: './roles/get.yaml'
    patch:
      $ref: './roles/update.yaml'
    delete:
      $ref: './roles/delete.yaml'

  /me:
    get:
      $ref: './profile/get-me.yaml'

  /members:
    get:
      $ref: './members/list.yaml'
    post:
      $ref: './members/create.yaml'

  /members/role/options:
    get:
      $ref: './members/role-options.yaml'

  /members/role/options/{id}:
    get:
      $ref: './members/role-option.yaml'

  /members/{id}:
    get:
      $ref: './members/get.yaml'
    patch:
      $ref: './members/update.yaml'
    delete:
