tags: [Auth]
summary: 重設密碼
description: |
  使用密碼重設 Token 設定新密碼。Token 為單次使用，過期後失效。

security: []

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [token, newPassword]
        properties:
          token:
            type: string
            description: 密碼重設 Token（來自信件連結）
            example: abc123def456
          newPassword:
            type: string
            format: password
            description: 新密碼
            example: NewPassword123!

responses:
  '204':
    description: 密碼重設成功（無回應內容）

  '400':
    description: |
      Token 無效或已過期，或新密碼未通過複雜度檢核、欄位缺漏。
      Token 是否有效刻意不以狀態碼區分，避免成為「這枚 Token 存不存在」的探測管道。
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
        example:
          success: false
          message: 重設密碼連結無效或已過期
          code: BAD_REQUEST
          timestamp: '2024-01-01T00:00:00.000Z'

  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
