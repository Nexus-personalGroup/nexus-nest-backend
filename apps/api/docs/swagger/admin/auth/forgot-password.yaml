tags: [Auth]
summary: 忘記密碼
description: |
  傳送密碼重設信件。無論 Email 是否存在，回應皆相同（防止帳號列舉）。

security: []

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [email]
        properties:
          email:
            type: string
            format: email
            description: 電子郵件
            example: test@example.com

responses:
  '204':
    description: |
      請求已接受（無回應內容）。信箱是否存在皆回相同結果，
      提示文案由前端固定呈現——後端不回任何足以區分的內容。

  '400':
    $ref: '../openapi.yaml#/components/responses/BadRequest'

  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
