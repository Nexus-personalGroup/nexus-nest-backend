tags: [Moderation]
summary: 查詢成員所在的聊天室
description: |
  需 `BACKEND:MODERATION:VIEW` 權限。

  **與前台的「我的房間」是同一支查詢**，差別只在授權來源：
  前台是「你只能查自己的」（memberId 來自 token），
  這裡是「有權限就能查任何人的」（memberId 來自 path）。

  `name` 為 null 代表私聊——顯示名稱由對方決定，不落庫。
  `createdAt` 是**房間的建立時間**，不是該成員的加入時間。

parameters:
  - name: memberId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: page
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100

responses:
  '200':
    description: 查詢成功
    content:
      application/json:
        schema:
          type: object
          required: [success, data, timestamp]
          properties:
            success:
              type: boolean
            data:
              type: object
              required: [list, meta]
              properties:
                list:
                  type: array
                  items:
                    type: object
                    required: [id, roomType, name, memberCount, createdAt]
                    properties:
                      id:
                        type: string
                        format: uuid
                      roomType:
                        type: string
                        enum: [DIRECT, GROUP]
                      name:
                        type: string
                        nullable: true
                        description: 群組名稱；私聊為 null
                      memberCount:
                        type: integer
                      createdAt:
                        type: string
                        format: date-time
                        description: 房間的建立時間
                meta:
                  type: object
                  required: [page, limit, total, totalPages]
                  properties:
                    page:
                      type: integer
                    limit:
                      type: integer
                    total:
                      type: integer
                    totalPages:
                      type: integer
            timestamp:
              type: string
              format: date-time
  '401':
    $ref: '../openapi.yaml#/components/responses/NoToken'
  '403':
    $ref: '../openapi.yaml#/components/responses/Forbidden'
  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
