tags: [Moderation]
summary: 解除停權
description: |
  需 `BACKEND:MODERATION:EDIT` 權限。恢復該成員的帳號，使用者重新登入即可。

  **不會主動通知或恢復連線**：他的連線已經斷了、token 也失效了，
  沒有任何管道可以推給他。要通知得走 email 或推播通知，那是另一個主題。

  **解除同樣留稽核**：`members.status` 只留下「現在是什麼狀態」，
  留不下「誰在什麼時候改的」，而反覆停權再解除本身就是可疑行為。

  **冪等**：對未停用的帳號解除回 `204`，不重複稽核。

parameters:
  - name: memberId
    in: path
    required: true
    schema:
      type: string
      format: uuid

responses:
  '204':
    description: 已解除（無回應內容）；本來就啟用時同樣回 204
  '401':
    $ref: '../openapi.yaml#/components/responses/NoToken'
  '403':
    $ref: '../openapi.yaml#/components/responses/Forbidden'
  '404':
    description: 成員不存在
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
        example:
          success: false
          message: 找不到帳號
          code: MEMBER_NOT_FOUND
          timestamp: '2026-08-21T06:00:00.000Z'
  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
