tags: [Moderation]
summary: 還原被誤移除的訊息
description: |
  需 `BACKEND:MODERATION:EDIT` 權限。

  誤判在審閱情境是真實的——沒有回頭路會讓管理員傾向不敢處理，
  而一個不敢用的工具等於沒有工具。

  **不影響使用者自己的撤回狀態**：若該則原本已被發送者撤回，
  還原後它會回到「已收回」而非完全正常。推播的 payload 會帶還原後的 `retractedAt`，
  讓客戶端知道要顯示哪一種。

  **還原同樣留稽核**：`removedAt` 清除後，「這則曾被移除過」就不再留在訊息列上，
  而反覆移除再還原本身就是可疑行為。

  **冪等**：還原未被移除的訊息回 `204`，不推播。

parameters:
  - name: messageId
    in: path
    required: true
    schema:
      type: string
      format: uuid

responses:
  '204':
    description: 已還原（無回應內容）；未被移除時同樣回 204
  '401':
    $ref: '../openapi.yaml#/components/responses/NoToken'
  '403':
    $ref: '../openapi.yaml#/components/responses/Forbidden'
  '404':
    description: 訊息不存在
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
        example:
          success: false
          message: 訊息不存在或不是你發送的
          code: CHAT_MESSAGE_NOT_FOUND
          timestamp: '2026-08-21T06:00:00.000Z'
  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
