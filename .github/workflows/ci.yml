# 品質關卡
#
# 規則細節見 openspec/specs/platform-ci-quality-gate/spec.md。
#
# ⚠️ 本 workflow 只負責「執行檢查並回報」。要讓失敗真的擋住合併，
# 必須在 repo Settings → Branches 把 quality 與 e2e 設為 required status checks——
# 那項設定不在版控內。

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 同一分支連續推送時取消尚未跑完的舊 run，避免排隊等待已經過時的結果
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # git hook 在 CI 沒有意義，且 husky 在無 .git hooks 目錄時會噪音
  HUSKY: '0'
  # typecheck / lint 的 pre script 會跑 db:generate，需要 DB_* 組出 DATABASE_URL。
  # generate 不連線，但 prisma.config.ts 仍要拼出合法的 URL 字串
  DB_HOST: localhost
  DB_PORT: '5432'
  DB_USERNAME: postgres
  DB_PASSWORD: ci-e2e-secret
  DB_DATABASE: nexus_ci_test
  AWS_MEDIA_LIBRARY_ROOT: local

jobs:
  # 型別 / lint / 單元測試 + 覆蓋率門檻 + 架構守則。不需外部服務，
  # 多數問題在此於數十秒內回報，開發者不必等 e2e 的資料庫起來
  quality:
    name: 品質檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - run: pnpm typecheck
      - run: pnpm lint

      # 必須是 test:cov 不是 test——四個覆蓋率門檻只在前者執行，
      # 用 test 會讓門檻靜默失效（那正是 platform-ci-quality-gate 要防的事）
      - name: 單元測試 + 覆蓋率門檻 + 架構守則
        run: pnpm test:cov

  # 對真實 PostgreSQL 跑完整 API 流程（Redis 於測試中 mock）
  e2e:
    name: E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-e2e-secret
          POSTGRES_DB: nexus_ci_test
        ports:
          - 5432:5432
        # 判定指令與 compose.yml 的 postgres / postgres-verify 一致。
        # 不可改用固定秒數或 TCP 輪詢：PostgreSQL 官方映像初始化時會先起一次
        # 臨時伺服器，埠已開但尚未接受正式連線，探埠會誤判為就緒
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_ci_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # 庫名必須含 test，否則 e2e 的 globalSetup 守門會中止（防誤連 dev / prod）
      DB_TEST_DATABASE: nexus_ci_test

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      # pnpm install 的 postinstall 只建 symlink，client 仍需自行 generate
      - run: pnpm --filter @app/api db:generate
      - run: pnpm --filter @app/api test:e2e

  # 跨實例行為：起兩個 API 實例 + 真 Redis，驗證 A 實例送出的事件 B 實例收得到。
  #
  # 與 e2e 分開而非併進去，因為兩者的前置條件**相反**：e2e 把 Redis mock 掉
  # （它驗的是單一實例內的 API 行為，真 Redis 只會多一個不穩定來源），
  # 這裡則必須用真 Redis——跨實例廣播完全建立在 pub/sub 之上，mock 掉就沒東西可驗。
  #
  # 沒有這個 job 的話，拿掉 redis-adapter 或改壞它的掛載時機，CI 一樣全綠——
  # 那類失效在單一實例內完全看不出來。
  integration:
    name: 跨實例整合
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-e2e-secret
          POSTGRES_DB: nexus_ci_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_ci_integration_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      # CI 首次需要 Redis——至今不需要是因為 e2e 把它 mock 掉了
      redis:
        image: redis:7
        ports:
          - 6379:6379
        # 與 compose.yml 的 redis 用同一個判定指令。Redis 沒有 PostgreSQL 那種
        # 「初始化時先起臨時伺服器」的陷阱，但仍不可用固定秒數等待
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # 庫名必須含 test，否則 applyE2EDbEnv 的守門會中止（防誤連 dev / prod）。
      # 與 e2e 用不同的庫，避免兩個 job 平行執行時互相清資料
      DB_DATABASE: nexus_ci_integration_test
      DB_TEST_DATABASE: nexus_ci_integration_test
      # Redis 連線指向 service container。setup-env.integration.ts 有同樣的預設值，
      # 這裡明寫是為了讓 workflow 自身看得出這個 job 需要 Redis
      REDIS_HOST: localhost
      REDIS_PORT: '6379'

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - run: pnpm --filter @app/api db:generate
      - run: pnpm --filter @app/api test:integration

  # 建置 TypeScript（api + web）。品質未過就不浪費資源建置；
  # e2e 與 integration 刻意不列入 needs——它們較慢，不該阻塞產出，
  # 但失敗仍會使整個 workflow 失敗
  #
  # PR 階段也要跑：nest build / vite build 會抓到 path alias 解析、decorator metadata
  # 與 emit 階段的錯誤，這些 tsc --noEmit 抓不到。只在 push 時跑等於「PR 是綠的，
  # 合併完 develop 才紅」——把問題推到最不該爆的地方
  build:
    name: 建置
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - run: pnpm --filter @app/api db:generate
      - run: pnpm build
